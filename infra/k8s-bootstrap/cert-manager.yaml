# cert-manager + letsencrypt ClusterIssuer.
# 装完 terraform apply 之后:
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace \
#     --set installCRDs=true --version v1.13.3
#   kubectl apply -f cert-manager.yaml

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-ops@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    # DNS-01: 用 Route53 验证 (跟 AWS ACM 互不冲突, 都能签发)
    - dns01:
        route53:
          region: us-east-1
          # 用 IRSA: cert-manager service account 已绑 IAM role
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform-ops@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
    - dns01:
        route53:
          region: us-east-1
