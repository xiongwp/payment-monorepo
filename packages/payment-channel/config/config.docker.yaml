# config.docker.yaml — for `docker-compose up payment-channel`.
#
# 用户那边 `shared-shard-0..9` 是真分片集群，每个节点存自己那一片的数据
# （shared-shard-2 只有 paychan_db_2 那个 schema）。所以 DSN 必须按 shard
# index 映射到对应节点。`paychan_meta` 单独放在 `shared-meta` 节点上；如果
# 没有独立 meta 节点，改成任一 shard 节点（比如 shared-shard-0）即可。
# 首次上线前：scripts/init-shared-db.sh

server:
  grpc_port: 9092
  webhook_http_addr: ":9192"

metrics:
  addr: ":9093"

sharding:
  db_count: 10
  table_per_db: 10

# 联栈开发模式：跳过鉴权，方便 grpc-client / e2e / 内部 RPC 直连。生产严禁如此。
auth:
  tokens: []
  allow_unauthenticated: true

rate_limit:
  rps: 2000
  burst: 4000

database:
  meta:
    name: paychan_meta
    dsn: "root:password@tcp(shared-meta:3306)/paychan_meta?charset=utf8mb4&parseTime=True&loc=Local"
    max_open_conns: 20
    max_idle_conns: 5
    conn_max_lifetime: 3600
  shards:
    - name: paychan_db_0
      dsn: "root:password@tcp(shared-shard-0:3306)/paychan_db_0?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_1
      dsn: "root:password@tcp(shared-shard-1:3306)/paychan_db_1?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_2
      dsn: "root:password@tcp(shared-shard-2:3306)/paychan_db_2?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_3
      dsn: "root:password@tcp(shared-shard-3:3306)/paychan_db_3?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_4
      dsn: "root:password@tcp(shared-shard-4:3306)/paychan_db_4?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_5
      dsn: "root:password@tcp(shared-shard-5:3306)/paychan_db_5?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_6
      dsn: "root:password@tcp(shared-shard-6:3306)/paychan_db_6?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_7
      dsn: "root:password@tcp(shared-shard-7:3306)/paychan_db_7?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_8
      dsn: "root:password@tcp(shared-shard-8:3306)/paychan_db_8?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: paychan_db_9
      dsn: "root:password@tcp(shared-shard-9:3306)/paychan_db_9?charset=utf8mb4&parseTime=True&loc=Local"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600

# 15 个 PH 渠道统一指向容器内 mockserver。
channel:
