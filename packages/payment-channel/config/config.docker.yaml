    env: sandbox
    partner_id: "MOCK_PARTNER"
    notify_url: "http://payment-channel:9192/wh/gcash"
    base_url: "http://paychan-mockserver:9400"
  maya:
    env: sandbox
    public_key: "pk_mock"
    secret_key: "sk_mock"
    redirect_ok: "http://127.0.0.1:9091/ret?r=ok"
    redirect_fail: "http://127.0.0.1:9091/ret?r=fail"
    redirect_cancel: "http://127.0.0.1:9091/ret?r=cancel"
    base_url: "http://paychan-mockserver:9400"
