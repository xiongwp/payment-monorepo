server:
  name: accounting-system
  host: 0.0.0.0
  port: 8888
  grpc_port: 50051
  metrics_port: "9090"  # Prometheus /metrics HTTP 接口端口
  env: dev

  # 入口过载保护（load shedding）
  # 饱和时 gRPC fast-fail 返回 ResourceExhausted，打 LoadShedDroppedTotal{reason} 计数。
  # 保护 DB 连接池、goroutine、锁。全为 0 表示不启用（开发默认）。
  # 生产建议（10 库 × 50 conn = 500 pool）：max_inflight = 400、rate_per_second = 5000、burst = 10000。
  load_shed:
    max_inflight: 0
    rate_per_second: 0
    burst: 0

  # 单条 gRPC RPC 最长执行时间（秒）。0 = 不限。
  # 防御：客户端忘记设 deadline + 大日期范围 ListTransactions 等查询独占
  # goroutine + DB 连接的资源耗尽攻击。生产建议 30。
  max_rpc_duration_seconds: 0

  # HTTP admin 共享 secret token。设置后所有 admin 请求必须带
  #   X-Admin-Token: <token>
  # 头才能通过；缺失或错误返回 401。空字符串 = 关闭鉴权（开发默认；
  # 生产强制配置，否则任何能访问 admin 端口的人都能改 registry / 触发归档）。
  # 也支持 ADMIN_HTTP_TOKEN 环境变量覆盖（部署时不必嵌进 yaml）。
  admin_http_token: ""

# ─── Outbox backpressure ─────────────────────────────────────────────────────
# 当 OutboxPendingGauge 超过 high_threshold 时，把 load_shed.max_inflight 降到
# 原值的 shrink_ratio，给 OutboxWorker 留时间追上 MySQL 写入；落到
# low_threshold 以下时恢复。两阈值用 hysteresis 防抖。
# 仅当 load_shed.max_inflight > 0 时生效。
outbox_backpressure:
  high_threshold: 5000
  low_threshold:  1000
  shrink_ratio:   0.5

# 数据库配置 - 10个库
database:
  shard_count: 10
  table_count: 100
  # 启动时预热各分库 + meta 库的连接池：每个 DB 开少量 (≤8) ping 连接然后归还，
  # 让 idle slot 有内容，避免首批请求每条都付 TCP+鉴权延迟。
  # 注意：曾经的实现一次性 ping 50 conns × 11 dbs = 550 个并发连接 → 撞穿 MySQL
  # 默认 max_connections=151；现已改为单 DB ≤ MaxOpen/4 (cap 8)，串行遍历分库。
  # 本地 / 小型 MySQL 仍建议 false 节约启动时连接消耗。
  warm_pool_on_start: false
  # account_meta 全局元数据库（account_type_info / transaction_rule，不分片）
  meta_database:
    name: account_meta
    dsn: "root:password@tcp(127.0.0.1:3306)/account_meta?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
    max_open_conns: 50   # 规则缓存命中后极少触及，缓存未命中时10个分库可能同时查询
    max_idle_conns: 20
    conn_max_lifetime: 3600
  databases:
    - name: accounting_db_0
      dsn: "root:password@tcp(127.0.0.1:3306)/accounting_db_0?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: accounting_db_1
      dsn: "root:password@tcp(127.0.0.1:3306)/accounting_db_1?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: accounting_db_2
      dsn: "root:password@tcp(127.0.0.1:3306)/accounting_db_2?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: accounting_db_3
      dsn: "root:password@tcp(127.0.0.1:3306)/accounting_db_3?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: accounting_db_4
      dsn: "root:password@tcp(127.0.0.1:3306)/accounting_db_4?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: accounting_db_5
      dsn: "root:password@tcp(127.0.0.1:3306)/accounting_db_5?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: accounting_db_6
      dsn: "root:password@tcp(127.0.0.1:3306)/accounting_db_6?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
      max_open_conns: 50
      max_idle_conns: 20
      conn_max_lifetime: 3600
    - name: accounting_db_7
      dsn: "root:password@tcp(127.0.0.1:3306)/accounting_db_7?charset=utf8mb4&parseTime=True&loc=Local&clientFoundRows=true"
      max_open_conns: 50
