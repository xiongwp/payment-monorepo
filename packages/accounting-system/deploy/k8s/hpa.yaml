    #   object:
    #     metric:
    #       name: accounting_outbox_pending_records
    #     describedObject:
    #       apiVersion: apps/v1
    #       kind: Deployment
    #       name: accounting-system
    #     target:
    #       type: Value
    #       value: "20"   # 平均 pending > 20 → 扩容
