# reconplatform 联栈：Kafka + Redis + ClickHouse + reconplatform 服务自身。
#
# v2 升级：原 demo（hardcoded localhost）改为读 RECON_* 环境变量 + config-center
# 拉规则。共享 payment-stack 网络让 reconplatform 容器能 DNS 解析 config-center。
#
# version: "3.8" 在新 compose 已 obsolete，去掉避免 warning。

networks:
  default:
    name: ${SHARED_DB_NETWORK:-payment-stack}
    external: true

# BuildKit secret：Dockerfile 里 git clone fallback 用 GITHUB_TOKEN（私仓兜底）。
# 没有 GITHUB_TOKEN host env 时本字段 required: false 让 build 不报错；
# 有公仓或本地 additional_contexts 注入时也不需要 token，secret 留空即可。
secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN

services:
  recon-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recon-kafka
    expose:
      - "9092"
    environment:
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true

  recon-redis:
    image: redis:7
    container_name: recon-redis
    expose:
      - "6379"

  recon-clickhouse:
    image: clickhouse/clickhouse-server:23
    container_name: recon-clickhouse
    expose:
      - "8123"
      - "9000"

  reconplatform:
    # 自动 build（历史依赖运维手动 docker build 一遍，每次变更要外部脚本同步）。
    # 现在 docker compose up --build 一行起栈；image tag 显式 :latest 历史保持一致。
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        payment-util: ../payment-util
      secrets:
        - GITHUB_TOKEN
    image: reconplatform:latest
    # pull_policy: never 防 compose up 误从 registry 拉（这个 tag 永远本地 build 的）。
    pull_policy: never
    container_name: reconplatform
    depends_on:
      - recon-kafka
      - recon-redis
    environment:
      RECON_ENV: ${RECON_ENV:-dev}
      RECON_REDIS_ADDR: "recon-redis:6379"
      RECON_KAFKA_BROKERS: "recon-kafka:9092"
      RECON_KAFKA_CONSUME_TOPICS: "order,payment"
      RECON_KAFKA_PRODUCE_TOPIC: "reconcile_result"
      RECON_KAFKA_CONSUMER_GROUP: "reconplatform"
      # config-center: 规则全部从 namespace=reconplatform 下 key="rules" 拉（JSON map[string]string）
      RECON_CONFIGCENTER_ENDPOINT: "http://config-center:9691"
      # CDC 用 MySQL 账号 — 必须在 shared-shard-* / shared-meta 里 GRANT
      # REPLICATION SLAVE, REPLICATION CLIENT, SELECT 权限。
      # configs/cdc.sources.yaml 里 user/password 字段就是读这两个 env。
      RECON_CDC_USER: ${RECON_CDC_USER:-recon_cdc}
      RECON_CDC_PASS: ${RECON_CDC_PASS:-recon_cdc_pwd}
