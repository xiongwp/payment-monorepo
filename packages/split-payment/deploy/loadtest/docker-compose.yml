# ============================================================================
# 轮换账户 End-to-End 压测栈 — 纯加法模式
#
# 这份 compose 只包含 loadtest 需要、但 accounting-system 自己的 compose 没起的：
#   - etcd（服务发现）
#   - split-payment（业务编排层）
#   - loadtest（Go 压测客户端）
#
# 真正的 accounting-system 栈（10 个 mysql 分库 + redis + kafka + accounting-service
# 自身）由 packages/accounting-system/docker-compose.yml 起。
# 通过共享的 payment-stack 外部网络互通：
#
#   accounting-service:50051   ← split-payment 调
#   accounting-redis:6379      ← accounting-service 用
#   accounting-mysql-{0..9}    ← accounting-service 用
#   accounting_meta            ← accounting-service 用
#
# 启动顺序（scripts/run.sh 自动按这个顺序）：
#   1. docker compose -f packages/accounting-system/docker-compose.yml up -d
#   2. docker compose -f packages/split-payment/deploy/loadtest/docker-compose.yml up -d
#
# 前置：
#   docker network create payment-stack       （只跑一次）
#   export GITHUB_TOKEN=ghp_xxx                （build 镜像需要）
# ============================================================================

networks:
  default:
    name: ${SHARED_DB_NETWORK:-payment-stack}
    external: true

services:
  # ─── etcd（服务发现 + config-center）─────────────────────────────────────
  # accounting-system 自己的 compose 已显式不含 etcd（注释 "ETCD-CLEAN: 已删,
  # 用 risk-stack 的 etcd"），所以由 loadtest 这边补上。
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: loadtest-etcd
    # 关键：accounting-system 那边的 service 用 `REGISTRY_ENDPOINTS=etcd:2379` 找这个容器；
    # 跨 compose 项目共享 payment-stack 网络时，DNS 只能匹配 container_name 或 alias。
    # 容器名是 loadtest-etcd → 加个 alias `etcd` 让 accounting / split-payment 都能解析到。
    networks:
      default:
        aliases:
          - etcd
    environment:
      ETCD_NAME: "etcd0"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:2380"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd:2380"
      ETCD_INITIAL_CLUSTER: "etcd0=http://etcd:2380"
      ETCD_INITIAL_CLUSTER_STATE: "new"
      ETCD_INITIAL_CLUSTER_TOKEN: "loadtest-token"
    ports:
      - "12379:2379"

  # ─── split-payment（业务编排层）───────────────────────────────────────
  # context = monorepo 根（split-payment Dockerfile 用 `COPY packages/X/...`）。
  split-payment:
    build:
      context: ../../../../
      dockerfile: packages/split-payment/Dockerfile
      secrets:
        - GITHUB_TOKEN
    image: split-payment:rotation-loadtest
    container_name: loadtest-split-payment
    environment:
      SPLIT_PAYMENT_LOG_DEV: "false"
      # kitexutil 直接读的 global env（无前缀），用于 etcd 服务发现 + 自注册
      REGISTRY_ENDPOINTS: "etcd:2379"
      ADVERTISE_HOST: "loadtest-split-payment"
      # viper 前缀 = SPLIT_PAYMENT_；config 路径 accounting.grpc_addr → 这个 env name。
      SPLIT_PAYMENT_ACCOUNTING_GRPC_ADDR: "accounting-service:50051"
      SPLIT_PAYMENT_REGISTRY_ENDPOINTS: "etcd:2379"
      # 启动期自动 seed 资金流 graph（4 个：topup/payment/transfer/withdraw）
      # internal/config.go 把 seed.graph_dir 绑到 MONEYFLOW_SEED_DIR 这个 env 上
      MONEYFLOW_SEED_DIR: "/loadtest/graphs"
    volumes:
      - ./graphs:/loadtest/graphs:ro
    ports:
      - "19098:9098"   # gRPC
      - "19099:9099"   # admin HTTP

  # ─── loadtest 客户端 ────────────────────────────────────────────────
  # binary 源 = packages/split-payment/cmd/loadtest/main.go（复用 split-payment 的 go.mod）
  loadtest:
    build:
      context: ../../                                       # = packages/split-payment 根
      dockerfile: deploy/loadtest/Dockerfile.loadtest
      additional_contexts:
        payment-util:        ../../../payment-util          # = packages/payment-util
        accounting-system:   ../../../accounting-system     # = packages/accounting-system
        accounting-grpc-api: ../../../accounting-grpc-api   # = packages/accounting-grpc-api
      secrets:
        - GITHUB_TOKEN
    image: rotation-loadtest:latest
    container_name: loadtest-client
    depends_on:
      - split-payment
    environment:
      LOADTEST_TARGET_SPLIT_PAYMENT_ENDPOINT: "split-payment:9098"
      LOADTEST_TARGET_ACCOUNTING_ENDPOINT:    "accounting-service:50051"
      LOADTEST_TARGET_ACCOUNTING_ADMIN_HTTP:  "http://accounting-service:8888"
      LOADTEST_REPORT_OUTPUT_PATH:            "/output/loadtest-report.json"
    volumes:
      - ./config/loadtest.yaml:/loadtest/config.yaml:ro
      - ./scripts:/loadtest/scripts:ro
      - ./output:/output
    # 默认参数 = 跑 60s mixed（CI 友好）；
    # 交互式：docker compose run --rm loadtest --mode=topup --duration=30s
    command: ["--config=/loadtest/config.yaml"]

# BuildKit secrets：从环境变量读取 GITHUB_TOKEN
secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
