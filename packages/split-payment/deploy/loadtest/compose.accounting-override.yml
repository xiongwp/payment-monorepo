# ============================================================================
# accounting-system docker-compose.yml 的 loadtest 覆盖
#
# 把 accounting-service / accounting-batchtask 默认 mount 的
#   ./config/config.docker.yaml （Redis Sentinel 3 节点模式）
# 改成本目录下的 single-redis 版本。
#
# Compose 多 -f 文件合并默认是「列表追加」；要整段替换 volumes 必须用
# `!override` tag 标记到 volumes 这个 key 上（不是单个列表项）。
#
# `${LOADTEST_DIR}` 由 scripts/run.sh export，避免相对路径按
# project_directory（= accounting-system/）解析出错。
# ============================================================================

services:
  accounting-service:
    volumes: !override
      - "${LOADTEST_DIR}/config/accounting-config.loadtest.yaml:/app/config/config.yaml:ro"
      - app-logs:/app/logs
    environment:
      # 跨 compose 项目共享 payment-stack 网络时，service name "etcd" 解析不到
      # loadtest 栈里的 etcd 容器。直接用 container_name `loadtest-etcd` 兜底。
      # （我们也给 etcd 加了 network alias，但 alias 在 macOS Docker Desktop
      # 偶发不生效，container_name 是最稳的）。
      - ETCD_ENDPOINTS=loadtest-etcd:2379
      - REGISTRY_ENDPOINTS=loadtest-etcd:2379

  accounting-batchtask:
    volumes: !override
      - "${LOADTEST_DIR}/config/accounting-config.loadtest.yaml:/app/config/config.yaml:ro"
      - app-logs:/app/logs
    environment:
      - ETCD_ENDPOINTS=loadtest-etcd:2379
      - REGISTRY_ENDPOINTS=loadtest-etcd:2379
