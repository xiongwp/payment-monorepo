# SP-AC-7 PH3-3: SealedSecret fallback — 集群没装 Vault / ESO 时用.
#
# 工作流:
#   1. 集群装 sealed-secrets controller (kubeseal):
#      helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
#   2. 本地写一份明文 Secret (NEVER commit), 然后 kubeseal 加密:
#
#      cat > /tmp/split-payment-secrets-plain.yaml <<EOF
#      apiVersion: v1
#      kind: Secret
#      metadata:
#        name: split-payment-secrets
#        namespace: payment
#      type: Opaque
#      stringData:
#        dsn: "split_user:RealPassword@tcp(mysql.payment.svc:3306)/split_payment?parseTime=true&charset=utf8mb4"
#        admin_token: "REAL_TOKEN_HERE"
#        kafka_sasl_username: "split-payment"
#        kafka_sasl_password: "REAL_KAFKA_PASS"
#        accounting_admin_token: "REAL_ACCT_TOKEN"
#        risk_auth_token: "REAL_RISK_TOKEN"
#        aml_auth_token: "REAL_AML_TOKEN"
#        fx_auth_token: "REAL_FX_TOKEN"
#      EOF
#
#      kubeseal --controller-namespace=kube-system \
#        --format=yaml < /tmp/split-payment-secrets-plain.yaml \
#        > deploy/k8s/sealed-secret-fallback.yaml.encrypted
#
#      rm /tmp/split-payment-secrets-plain.yaml
#
#   3. 把 *.encrypted commit 到 git, controller 解密成普通 Secret split-payment-secrets.
#
# 限制 (相对 ESO):
#   - 旋钥需要 kubeseal 重 seal 所有 Secret + commit + redeploy.
#   - controller master key 泄漏需要轮换 + 所有 Secret 重 seal (运维痛苦).
#   - 多集群同 Secret 需要 --scope strict / cluster-wide 选择.
#
# 推荐: prod 用 ESO + Vault, staging/dev 用 SealedSecret 起步, 文档保留两条路.
---
# 占位 SealedSecret — 实际由 kubeseal 生成 .encryptedData 字段. 这里仅给出结构.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: split-payment-secrets
  namespace: payment
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    # 实际 ciphertext 由 kubeseal 填充, 例如:
    #   dsn: AgC8a3X2k7H...  (~600 byte base64)
    #   admin_token: AgB5q...
    dsn: REPLACE_WITH_KUBESEAL_OUTPUT
    admin_token: REPLACE_WITH_KUBESEAL_OUTPUT
    kafka_sasl_username: REPLACE_WITH_KUBESEAL_OUTPUT
    kafka_sasl_password: REPLACE_WITH_KUBESEAL_OUTPUT
    accounting_admin_token: REPLACE_WITH_KUBESEAL_OUTPUT
    risk_auth_token: REPLACE_WITH_KUBESEAL_OUTPUT
    aml_auth_token: REPLACE_WITH_KUBESEAL_OUTPUT
    fx_auth_token: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: split-payment-secrets
      namespace: payment
    type: Opaque
