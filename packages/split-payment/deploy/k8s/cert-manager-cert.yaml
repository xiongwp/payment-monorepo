# SP-AC-7 PH3-2: mTLS 证书签发 — cert-manager 管理 split-payment 服务证书.
#
# 前置:
#   1. 集群安装 cert-manager (>=v1.13): https://cert-manager.io/docs/installation/
#   2. 有一个 internal CA Issuer 名 "payment-internal-ca" (集群级 ClusterIssuer 或 ns Issuer).
#      若不存在, 见下方 InternalCA Issuer 示例 — 用一个 self-signed CA Secret 起步.
#
# 渲染产物:
#   - Secret split-payment-mtls (kubernetes.io/tls 类型 + ca.crt) → Pod 通过 volume 挂 /etc/certs.
#   - 自动 renew (Renewal duration = 1/3 lifespan, 默认 30d 前 renew).
#
# DNS SAN 需匹配 split-payment Service: split-payment.payment.svc / 同 ns 短名 split-payment.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: split-payment-mtls
  namespace: payment
  labels:
    app: split-payment
    sp-ac: "7"
    phase: "3"
spec:
  secretName: split-payment-mtls
  duration: 2160h   # 90 天
  renewBefore: 720h # 30 天 — cert-manager 自动 renew
  subject:
    organizations:
      - "payment-platform"
  commonName: split-payment.payment.svc
  dnsNames:
    - split-payment
    - split-payment.payment
    - split-payment.payment.svc
    - split-payment.payment.svc.cluster.local
    - localhost
  usages:
    - server auth
    - client auth   # mTLS 用 — 同份证书 client + server 双用
    - digital signature
    - key encipherment
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always  # renew 时强制换 key, 防 key compromise 长尾
  issuerRef:
    name: payment-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
# 可选 — 集群没装 ClusterIssuer 时, 拿这个 self-signed 起步 (dev/staging only).
# 生产强烈建议用真 CA (Vault PKI / AWS PCA / cloud-provider managed CA).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: payment-internal-ca-bootstrap
  namespace: payment
spec:
  selfSigned: {}
---
# 用上面 self-signed Issuer 颁发一张 CA 证书, 落 Secret payment-internal-ca-secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payment-internal-ca
  namespace: payment
spec:
  secretName: payment-internal-ca-secret
  duration: 87600h  # 10 年 — CA 长寿命
  renewBefore: 720h
  commonName: "Payment Platform Internal CA"
  isCA: true
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: payment-internal-ca-bootstrap
    kind: Issuer
    group: cert-manager.io
---
# 用 payment-internal-ca-secret 当 CA, 起一个 ClusterIssuer, 让所有 ns 共用一套 mTLS PKI.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: payment-internal-ca
spec:
  ca:
    secretName: payment-internal-ca-secret
