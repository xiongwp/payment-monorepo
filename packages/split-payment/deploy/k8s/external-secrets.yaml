# SP-AC-7 PH3-3: secret management — Vault (via External Secrets Operator).
#
# 前置:
#   1. 集群安装 External Secrets Operator (ESO) v0.9+:
#      helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
#   2. Vault 启用 Kubernetes Auth + 创建 role split-payment 允许读以下 path:
#      - secret/data/payment/split-payment    (DSN / admin token / kafka SASL)
#      - secret/data/payment/accounting       (accounting admin token, 远程调用用)
#      - secret/data/payment/common           (FX_AUTH_TOKEN / RISK_AUTH_TOKEN / AML_AUTH_TOKEN)
#   3. Vault role 绑定 ServiceAccount split-payment (见 deployment.yaml serviceAccountName).
#
# 渲染产物:
#   - K8s Secret split-payment-secrets (普通 Secret) — Deployment 直接 envFrom / secretKeyRef.
#   - 自动 refresh 每 1h (refreshInterval), Vault 改秘钥 1 小时内全集群刷新.
#
# 对比 SealedSecret 选 ESO:
#   - ESO: 真 secret 在 Vault, K8s 里只有 ExternalSecret CR (无秘钥); 旋钥不需要重新 seal.
#   - SealedSecret: 秘钥在 git, 集群密钥泄漏需要换 controller key + 重 seal 所有 Secret.
#
# 没装 ESO 的环境降级方案: 见 SEALED_SECRET_FALLBACK.md.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-payment
  namespace: payment
  labels:
    app: split-payment
    sp-ac: "7"
    phase: "3"
spec:
  provider:
    vault:
      server: "https://vault.payment.svc:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "split-payment"
          serviceAccountRef:
            name: split-payment
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: split-payment-secrets
  namespace: payment
  labels:
    app: split-payment
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-payment
    kind: SecretStore
  target:
    name: split-payment-secrets      # K8s Secret 名 — Deployment env 引用此名
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app: split-payment
          managed-by: external-secrets
  data:
    # MySQL 主库 DSN — 含密码
    - secretKey: dsn
      remoteRef:
        key: payment/split-payment
        property: dsn
    # gRPC AdminService token — 上游 admin-web BFF 持有同 token
    - secretKey: admin_token
      remoteRef:
        key: payment/split-payment
        property: admin_token
    # Kafka SASL/PLAIN (生产建议 mTLS Kafka, dev 用 SASL)
    - secretKey: kafka_sasl_username
      remoteRef:
        key: payment/split-payment
        property: kafka_sasl_username
    - secretKey: kafka_sasl_password
      remoteRef:
        key: payment/split-payment
        property: kafka_sasl_password
    # 下游服务调用 token
    - secretKey: accounting_admin_token
      remoteRef:
        key: payment/accounting
        property: admin_token
    - secretKey: risk_auth_token
      remoteRef:
        key: payment/common
        property: risk_auth_token
    - secretKey: aml_auth_token
      remoteRef:
        key: payment/common
        property: aml_auth_token
    - secretKey: fx_auth_token
      remoteRef:
        key: payment/common
        property: fx_auth_token
---
# Vault CA bundle 让 ESO 校验 Vault 证书. ConfigMap 由运维一次性 apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-ca
  namespace: payment
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_VAULT_CA_CERT
    -----END CERTIFICATE-----
---
# split-payment ServiceAccount — Vault Kubernetes Auth role 绑定它.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: split-payment
  namespace: payment
  labels:
    app: split-payment
