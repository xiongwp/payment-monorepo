# config.docker.yaml — for `docker-compose up` via deploy.sh 联栈模式。
#
# 联栈模式下 meta DB 指向共享的 shared-meta 节点上的 user_merchant_meta 库
# （由 deploy/shared-db/init/meta_init.sql 的合并 init 建出来）。

server:
  grpc_port: 9191

metrics:
  addr: ":9291"

database:
  meta:
    name: user_merchant_meta
    dsn: "root:password@tcp(shared-meta:3306)/user_merchant_meta?charset=utf8mb4&parseTime=True&loc=Local"
    max_open_conns: 50
    max_idle_conns: 20
    conn_max_lifetime: 3600
  # 10 库分片：shard-0..9 节点上的 user_merchant_db_0..9（与
  # accounting-system / order-core / payment-channel layout 对齐）。
  # 任一 shard_N.dsn 缺失 → 应用 fallback 单 meta 模式（仅 dev），merchants
  # 表已挪到分片库，fallback 必报 1146。
  shard_0: { name: user_merchant_db_0, dsn: "root:password@tcp(shared-shard-0:3306)/user_merchant_db_0?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_1: { name: user_merchant_db_1, dsn: "root:password@tcp(shared-shard-1:3306)/user_merchant_db_1?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_2: { name: user_merchant_db_2, dsn: "root:password@tcp(shared-shard-2:3306)/user_merchant_db_2?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_3: { name: user_merchant_db_3, dsn: "root:password@tcp(shared-shard-3:3306)/user_merchant_db_3?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_4: { name: user_merchant_db_4, dsn: "root:password@tcp(shared-shard-4:3306)/user_merchant_db_4?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_5: { name: user_merchant_db_5, dsn: "root:password@tcp(shared-shard-5:3306)/user_merchant_db_5?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_6: { name: user_merchant_db_6, dsn: "root:password@tcp(shared-shard-6:3306)/user_merchant_db_6?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_7: { name: user_merchant_db_7, dsn: "root:password@tcp(shared-shard-7:3306)/user_merchant_db_7?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_8: { name: user_merchant_db_8, dsn: "root:password@tcp(shared-shard-8:3306)/user_merchant_db_8?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }
  shard_9: { name: user_merchant_db_9, dsn: "root:password@tcp(shared-shard-9:3306)/user_merchant_db_9?charset=utf8mb4&parseTime=True&loc=Local", max_open_conns: 20, max_idle_conns: 5 }

# kms-manage gRPC（联栈下用容器 DNS）
kms:
  endpoint: "kms-manage:9290"
  bearer_token: ""
  rpc_timeout: 5s

# risk-manage gRPC（联栈）
risk:
  endpoint: "risk-manage:9490"
  rpc_timeout: 3s

# accounting-system gRPC（联栈，注册时建 USER_BALANCE 主账户）
accounting:
  endpoint: "accounting-service:50051"
  rpc_timeout: 5s

cache:
  merchant:
    size: 10000
    ttl: 60s
    warmup: 1000
  secret:
    size: 1024
    ttl: 5m

rate_limit:
  rps: 0
  burst: 0
  per_key:
    header: ""
    rps: 0
    burst: 0
    capacity: 10000
    ttl: 10m
  per_merchant:
    default_rps: 100

timeouts:
  default: 5s
  by_method:
    "/usermerchant.v1.MerchantService/AuthenticateByAPIKey": 1s
    "/usermerchant.v1.MerchantSecretService/BulkGetPlaintext": 3s

retention:
  enabled: false
  duration: 61320h
  interval: 24h

otel:
  endpoint: ""
  env: "docker"
  sample_ratio: 0.1
  export_timeout: 10s
  insecure: true

# 联栈开发模式：跳过鉴权，方便 grpc-client / e2e / 内部 RPC 直连。生产严禁如此。
auth:
  tokens: []
  allow_unauthenticated: true
