syntax = "proto3";

package usermerchant.v1;

option go_package = "github.com/xiongwp/user-merchant-core/api/proto/usermerchant/v1;usermerchantv1";

// 商户渠道凭据（密文）存储。
//
// 明文只有两条出口：
//   1) admin 首次 Put 时由 admin 提供；
//   2) payment-channel 在 adapter init 时通过 BulkGetPlaintext 拉原文解密后
//      一次加载到内存。
//
// 普通 admin List 路径永远只回 masked_hint。

message MerchantChannelSecret {
  int64  id           = 1;
  string merchant_id  = 2;
  string channel      = 3;
  string field_name   = 4;
  string masked_hint  = 5;
  int32  version      = 6;
  string created_by   = 7;
  int64  created_ms   = 8;
  int64  updated_ms   = 9;
}

message PutMerchantSecretRequest {
  string merchant_id = 1;
  string channel     = 2;
  string field_name  = 3;
  string plaintext   = 4;
  string actor       = 5;
}
message PutMerchantSecretResponse { MerchantChannelSecret secret = 1; }

message ListMerchantSecretsRequest {
  string merchant_id = 1;
  string channel     = 2; // 可选；空则列全部
}
message ListMerchantSecretsResponse { repeated MerchantChannelSecret secrets = 1; }

message DeleteMerchantSecretRequest {
  string merchant_id = 1;
  string channel     = 2;
  string field_name  = 3;
}
message DeleteMerchantSecretResponse {}

// BulkGetPlaintext is the adapter-init path: payment-channel calls this with
// the merchant + channel it's about to run a Charge on, gets every stored
// field's plaintext in one call. Separate RPC so it can be gated by a
// different bearer (service-to-service) than admin List.
message BulkGetMerchantSecretsRequest {
  string merchant_id = 1;
  string channel     = 2;
}
message BulkGetMerchantSecretsResponse {
  // field_name → plaintext
  map<string, string> fields = 1;
}

service MerchantSecretService {
  rpc Put              (PutMerchantSecretRequest)       returns (PutMerchantSecretResponse);
  rpc List             (ListMerchantSecretsRequest)     returns (ListMerchantSecretsResponse);
  rpc Delete           (DeleteMerchantSecretRequest)    returns (DeleteMerchantSecretResponse);
  rpc BulkGetPlaintext (BulkGetMerchantSecretsRequest)  returns (BulkGetMerchantSecretsResponse);
}
