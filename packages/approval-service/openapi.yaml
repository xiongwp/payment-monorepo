openapi: 3.1.0
info:
  title: Approval Service API (4-Eyes)
  version: "1.0.0"
  description: |
    高风险动作双人复核. 大额 payout / RTBF / 制裁解封 / KMS rotation / 1099-K corrections.

servers:
  - url: https://approval.payment.example.com

paths:
  /v1/actions:
    post:
      summary: 业务侧创建 approval action
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionCreate' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
    get:
      summary: 列
      parameters:
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 100 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/Action' }
                  count: { type: integer }

  /v1/actions/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }

  /v1/actions/{id}/approve:
    post:
      summary: 复核通过
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewer]
              properties:
                reviewer: { type: string }
                note: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '409':
          description: |
            - already_decided: 已是终态
            - self_approval: reviewer == requester
            - duplicate_reviewer: 该 reviewer 已审过

  /v1/actions/{id}/reject:
    post:
      summary: 复核拒绝
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewer, note]
              properties:
                reviewer: { type: string }
                note: { type: string, description: 拒绝必填 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }

  /v1/actions/{id}/cancel:
    post:
      summary: requester 撤回 (approved 后 30min 窗口)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requester]
              properties:
                requester: { type: string }
                reason: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }

  /v1/actions/{id}/execute:
    post:
      summary: 业务侧执行完后回写 (防 cancel 反悔)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }

  /v1/stream:
    get:
      summary: SSE 实时事件流 (biz-admin-web 接)
      responses:
        '200':
          description: |
            event-stream of `action_update` events.
          content:
            text/event-stream:
              schema: { type: string }

components:
  schemas:
    ActionCreate:
      type: object
      required: [type, resource, requester]
      properties:
        type:
          type: string
          enum:
            - payout_high_value
            - rtbf_erase
            - sanction_unfreeze
            - kms_rotate
            - tax_correction
            - merchant_secret_rotate
        resource: { type: string, description: 业务侧 ID (payout_xxx) }
        requester: { type: string }
        request_note: { type: string }
        required_approvals: { type: integer, default: 2, minimum: 2, maximum: 5 }
        payload:
          type: object
          additionalProperties: true

    Action:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        resource: { type: string }
        requester: { type: string }
        requester_at: { type: string, format: date-time }
        state:
          type: string
          enum: [pending, reviewing, approved, rejected, executed, expired, cancelled]
        approvals:
          type: array
          items:
            type: object
            properties:
              reviewer: { type: string }
              decision: { type: string, enum: [approve, reject] }
              note: { type: string }
              reviewed_at: { type: string, format: date-time }
        required_approvals: { type: integer }
        expires_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
