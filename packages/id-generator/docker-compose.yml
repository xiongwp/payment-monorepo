


services:

  mysql:
    image: mysql:8.0
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=256M
    networks:
      - accounting-network
    container_name: mysql-generator
    environment:
        MYSQL_ROOT_PASSWORD: password
        MYSQL_DATABASE: idgen
    ports:
      - "3318:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # docker-entrypoint-initdb.d 按字典序执行：
      #   01_init.sql        建主表 + INSERT 主流量号段
      #   02_init_shadow.sql LIKE 主表 + INSERT 影子号段（依赖 01 已建主表）
      - ./internal/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./internal/database/init_shadow.sql:/docker-entrypoint-initdb.d/02_init_shadow.sql:ro


  id-service:
    build:
      context: .
      additional_contexts:
        payment-util: ../payment-util
      secrets:
        - GITHUB_TOKEN
    environment:
      ETCD_ENDPOINT: accounting-etcd:2379
    depends_on:
      - mysql
    ports:
      - "9090:9090"
    networks:
      - accounting-network

networks:
  accounting-network:
    external: true

volumes:
  etcd-data:
  mysql-data:

# BuildKit secret：从环境变量读取 GITHUB_TOKEN，给 Dockerfile 的 git clone fallback。
# 用法：GITHUB_TOKEN=ghp_xxx docker compose build
secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN