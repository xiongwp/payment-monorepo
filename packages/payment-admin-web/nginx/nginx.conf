server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api 反代到后端 BFF（容器名 payment-admin-backend，端口 9190）
  location /api/ {
    proxy_pass http://payment-admin-backend:9190/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback：所有非 /api、非文件的请求都回 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
