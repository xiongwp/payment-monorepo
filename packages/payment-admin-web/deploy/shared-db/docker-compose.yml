# ┌────────────────────────────────────────────────────────────────────────┐
# │ 共享 MySQL 栈 —— 1 meta + 10 shard 容器                                  │
# │   shared-meta:    paychan_meta / order_meta / user_merchant_meta /      │
# │                   account_meta（network alias accounting_meta）         │
# │   shared-shard-N: paychan_db_N / order_db_N / accounting_db_N           │
# │                   (network alias accounting-mysql-N)                    │
# │ 所有系统的 metadb 都在 shared-meta；所有系统的分库分表都在 10 个 shard。 │
# └────────────────────────────────────────────────────────────────────────┘
#
# 需要先跑 generate-shared-init.sh 产 init/ 下的 SQL。deploy.sh 会代劳。
#
# 端口映射到 host（方便 mysql -h127.0.0.1 -P3307 直连调试）：
#   meta        :3400
#   shard0..9   :3410..3419
x-mysql-base: &mysql-base
  image: mysql:8.0
  # 不传 --default-authentication-plugin：8.0.34+ 弃用、8.4 已删。
  #
  # binlog 相关参数（reconplatform CDC 订阅用）：
  #   --log-bin              开启 binlog
  #   --binlog-format=ROW    行级日志（DML 用）
  #   --binlog-row-image=FULL 完整行数据，UPDATE 也带 before
  #   --server-id=N          每实例必须唯一；用 entrypoint 的 SERVER_ID env 设
  #   --binlog-expire-logs-seconds=604800  binlog 保留 7 天（防 disk 撑爆）
  #
  # server-id 由各 service override（meta=1, shard0=10, shard1=11, ..., shard9=19）。
  command:
    - mysqld
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --log-bin=mysql-bin
    - --binlog-format=ROW
    - --binlog-row-image=FULL
    - --binlog-expire-logs-seconds=604800
  environment:
    MYSQL_ROOT_PASSWORD: password
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-uroot", "-ppassword", "--silent"]
    interval: 10s
    timeout: 5s
    retries: 30

services:
  # shared-meta 同时承担 paychan_meta / order_meta / user_merchant_meta / account_meta。
  # accounting-system 配置里写死 host=accounting_meta，通过 network alias 解析到这里。
  meta:
    <<: *mysql-base
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
      - --server-id=1
    container_name: shared-meta
    ports: ["3400:3306"]
    volumes:
      - meta-data:/var/lib/mysql
      - ./init/meta_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    networks:
      payment-stack:
        aliases: [accounting_meta]

  # shared-shard-N 同时承担 paychan_db_N / order_db_N / accounting_db_N。
  # accounting-system 配置里写死 host=accounting-mysql-N，靠 network alias 走到 shared-shard-N。
  shard0:
    <<: *mysql-base
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
      - --server-id=10
    container_name: shared-shard-0
    ports: ["3410:3306"]
    volumes:
      - shard0-data:/var/lib/mysql
      - ./init/0_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    networks:
      payment-stack:
        aliases: [accounting-mysql-0]

  shard1:
