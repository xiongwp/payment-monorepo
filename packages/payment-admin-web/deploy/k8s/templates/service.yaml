# K8s 通用微服务模板。占位符：
#   ${SERVICE}        服务名（也是 etcd 注册的 service_name + Service DNS 名）
#   ${IMAGE}          完整镜像 ref，如 registry.example.com/order-core:0.1.0
#   ${GRPC_PORT}      容器内 gRPC 端口
#   ${METRICS_PORT}   容器内 Prometheus metrics 端口
#   ${REPLICAS}       初始副本数（HPA 会接管）
#
# 适用于 order-core / payment-core / payment-channel / user-merchant-core /
# risk-manage / kms-manage / accounting-system。
# accounting-batchtask 是 cron runner 也可用，但 HPA min=2 max=2（按 task type
# leader election 分布）。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${SERVICE}-config
  labels:
    app: ${SERVICE}
data:
  config.yaml: |
    # 实际内容由 helm chart / kustomize 注入；这里只是占位提示。
    registry:
      endpoints:
        - "etcd-svc.default.svc.cluster.local:2379"
      service_name: "${SERVICE}"
      ttl: "10s"
    server:
      grpc_port: ${GRPC_PORT}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE}
  labels:
    app: ${SERVICE}
spec:
  replicas: ${REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ${SERVICE}
  template:
    metadata:
      labels:
        app: ${SERVICE}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "${METRICS_PORT}"
        prometheus.io/path: "/metrics"
    spec:
      # 反亲和 + 拓扑散布：副本尽量散到不同 node / zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ${SERVICE}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ${SERVICE}
      terminationGracePeriodSeconds: 30
      containers:
        - name: ${SERVICE}
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: ${GRPC_PORT}
            - name: metrics
              containerPort: ${METRICS_PORT}
          env:
            # serviceregistry 自注册到 etcd 用的 advertise 地址；K8s 注入 POD_IP。
            - name: REGISTRY_ADVERTISE_ADDR
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12  # 最多 60s 启动
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # 让 K8s 先把 pod 从 Service endpoints 摘掉再 SIGTERM；防止
              # 还有请求打到正在退出的 pod。
              exec:
                command: ["sh", "-c", "sleep 10"]
      volumes:
        - name: config
          configMap:
            name: ${SERVICE}-config
---
apiVersion: v1
kind: Service
metadata:
  name: ${SERVICE}
  labels:
    app: ${SERVICE}
spec:
  type: ClusterIP
  selector:
    app: ${SERVICE}
  ports:
    - name: grpc
      port: ${GRPC_PORT}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: ${METRICS_PORT}
      targetPort: metrics
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${SERVICE}
  labels:
    app: ${SERVICE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${SERVICE}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 缩容 5min 窗口避免抖动
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ${SERVICE}
  labels:
    app: ${SERVICE}
spec:
  minAvailable: 1   # 滚动升级 / 节点维护时至少保留 1 个 pod
  selector:
    matchLabels:
      app: ${SERVICE}
