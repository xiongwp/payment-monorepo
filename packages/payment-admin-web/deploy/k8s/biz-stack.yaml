# ─── refund-engine ────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: refund-engine, namespace: payment, labels: { app: refund-engine } }
spec:
  replicas: 2
  selector: { matchLabels: { app: refund-engine } }
  template:
    metadata: { labels: { app: refund-engine }, annotations: { "prometheus.io/scrape": "true", "prometheus.io/port": "8080" } }
    spec:
      containers:
      - name: app
        image: refund-engine:local
        ports: [{ containerPort: 8080, name: http }]
        env:
        - { name: REFUND_HTTP_PORT, value: "8080" }
        - { name: MERCHANT_WEBHOOK_URL, value: "http://merchant-webhook:8080" }
        envFrom: [{ configMapRef: { name: biz-config } }, { secretRef: { name: biz-secrets } }]
        readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 30 }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: refund-engine, namespace: payment }
spec: { selector: { app: refund-engine }, ports: [{ port: 8080, targetPort: http }] }

# ─── kyc-service ──────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kyc-service, namespace: payment, labels: { app: kyc-service } }
spec:
  replicas: 1   # 流量低
  selector: { matchLabels: { app: kyc-service } }
  template:
    metadata: { labels: { app: kyc-service }, annotations: { "prometheus.io/scrape": "true", "prometheus.io/port": "8080" } }
    spec:
      containers:
      - name: app
        image: kyc-service:local
        ports: [{ containerPort: 8080, name: http }]
        env: [{ name: KYC_HTTP_PORT, value: "8080" }]
        envFrom: [{ configMapRef: { name: biz-config } }, { secretRef: { name: biz-secrets } }]
        readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: kyc-service, namespace: payment }
spec: { selector: { app: kyc-service }, ports: [{ port: 8080, targetPort: http }] }

# ─── audit-log ────────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: audit-log, namespace: payment, labels: { app: audit-log } }
spec:
  replicas: 2
  selector: { matchLabels: { app: audit-log } }
  template:
    metadata: { labels: { app: audit-log }, annotations: { "prometheus.io/scrape": "true", "prometheus.io/port": "8080" } }
    spec:
      containers:
      - name: app
        image: audit-log:local
        ports: [{ containerPort: 8080, name: http }]
        env: [{ name: AUDIT_HTTP_PORT, value: "8080" }]
        envFrom: [{ configMapRef: { name: biz-config } }, { secretRef: { name: biz-secrets } }]
        readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: audit-log, namespace: payment }
spec: { selector: { app: audit-log }, ports: [{ port: 8080, targetPort: http }] }

# ─── biz-admin-web ────────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: biz-admin-web, namespace: payment, labels: { app: biz-admin-web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: biz-admin-web } }
  template:
    metadata: { labels: { app: biz-admin-web } }
    spec:
      containers:
      - name: app
        image: biz-admin-web:local
        ports: [{ containerPort: 8080, name: http }]
        env:
        - { name: BIZ_ADMIN_HTTP_PORT, value: "8080" }
        - { name: BILLING_URL,  value: "http://billing-system:8080" }
        - { name: GATEWAY_URL,  value: "http://payment-gateway:8080" }
        - { name: DISPUTE_URL,  value: "http://dispute-service:8080" }
        - { name: WEBHOOK_URL,  value: "http://merchant-webhook:8080" }
        - { name: REFUND_URL,   value: "http://refund-engine:8080" }
        - { name: KYC_URL,      value: "http://kyc-service:8080" }
        - { name: AUDIT_URL,    value: "http://audit-log:8080" }
        envFrom: [{ configMapRef: { name: biz-config } }]
        readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: biz-admin-web, namespace: payment }
spec: { selector: { app: biz-admin-web }, ports: [{ port: 8080, targetPort: http }] }

# ─── Ingress (NGINX) ──────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biz-admin-ingress
  namespace: payment
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod   # 假定 cert-manager 装好了
spec:
  ingressClassName: nginx
  tls:
  - hosts: [admin.payment.example.com]
    secretName: biz-admin-tls
  rules:
  - host: admin.payment.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: { name: biz-admin-web, port: { number: 8080 } }

# ─── NetworkPolicy: 限制内部互访 ──────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: biz-internal-only
  namespace: payment
spec:
  podSelector: { matchLabels: { tier: business } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}                # 同 namespace 任意 pod
    - namespaceSelector:
        matchLabels: { name: ingress-nginx }   # 接 ingress
    - namespaceSelector:
        matchLabels: { name: monitoring }       # 接 prometheus scrape
