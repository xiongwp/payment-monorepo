# biz-stack.yaml — k8s 准生产部署清单 (8 个新业务服务).
#
# 应用:
#   kubectl apply -f biz-stack.yaml
#
# 前置:
#   - namespace 'payment' 已存在: kubectl create namespace payment
#   - image 已 push 到集群可访问的 registry (示例用 :local，prod 换 ECR/GCR)
#   - storage class 已配 (PVC 用 — billing/audit 暂不需要，memory repo)
#
# 包含:
#   - 8 个 Deployment (含 readinessProbe + livenessProbe + resource limits)
#   - 8 个 Service (ClusterIP)
#   - 8 个 HPA (CPU 70% scale 2-10 replicas)
#   - 1 个 Ingress 入口 (NGINX ingress controller 假定已装)
#   - 1 个 ConfigMap (统一 env)
#   - 1 个 Secret (API key / KMS key 占位)
#   - 1 个 NetworkPolicy (限制只允许同 namespace 互访)
#   - PodDisruptionBudget (生产滚动升级时保至少 50% 可用)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: biz-config
  namespace: payment
data:
  TZ: Asia/Shanghai
  RECON_ENV: prod
  BILLING_BASE_CURRENCY: USD

---
apiVersion: v1
kind: Secret
metadata:
  name: biz-secrets
  namespace: payment
type: Opaque
stringData:
  INTERNAL_TOKEN: REPLACE_ME_internal_service_token
  KMS_KEY: REPLACE_ME_kms_master_key

---
# ─── 8 Deployments + Services + HPAs ──────────────────────────────────

# 用 YAML anchor 复用通用配置
# (k8s 不支持 anchor 跨 doc，所以每个 service 手写一份，但结构一致)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-system
  namespace: payment
  labels: { app: billing-system, tier: business }
spec:
  replicas: 2
  selector: { matchLabels: { app: billing-system } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata:
      labels: { app: billing-system, tier: business }
      annotations: { "prometheus.io/scrape": "true", "prometheus.io/port": "8080", "prometheus.io/path": "/metrics" }
    spec:
      containers:
      - name: app
        image: billing-system:local
        imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8080, name: http }]
        env:
        - name: BILLING_HTTP_PORT
          value: "8080"
        envFrom: [{ configMapRef: { name: biz-config } }, { secretRef: { name: biz-secrets } }]
        readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 1, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: billing-system, namespace: payment }
spec:
  selector: { app: billing-system }
  ports: [{ port: 8080, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: billing-system, namespace: payment }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: billing-system }
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: billing-system, namespace: payment }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: billing-system } }

# ─── payment-gateway ──────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payment
  labels: { app: payment-gateway, tier: business }
spec:
  replicas: 3   # 流量大头多副本
  selector: { matchLabels: { app: payment-gateway } }
  template:
    metadata:
      labels: { app: payment-gateway }
      annotations: { "prometheus.io/scrape": "true", "prometheus.io/port": "8080" }
    spec:
      containers:
      - name: app
        image: payment-gateway:local
        ports: [{ containerPort: 8080, name: http }]
        env: [{ name: PAYMENT_GATEWAY_HTTP_PORT, value: "8080" }]
        envFrom: [{ configMapRef: { name: biz-config } }, { secretRef: { name: biz-secrets } }]
        readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 30 }
        resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: 2, memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: payment-gateway, namespace: payment }
spec:
  selector: { app: payment-gateway }
  ports: [{ port: 8080, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: payment-gateway, namespace: payment }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: payment-gateway }
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }

# ─── dispute-service ──────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: dispute-service, namespace: payment, labels: { app: dispute-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: dispute-service } }
  template:
    metadata: { labels: { app: dispute-service }, annotations: { "prometheus.io/scrape": "true", "prometheus.io/port": "8080" } }
    spec:
      containers:
      - name: app
        image: dispute-service:local
        ports: [{ containerPort: 8080, name: http }]
        env: [{ name: DISPUTE_HTTP_PORT, value: "8080" }]
        envFrom: [{ configMapRef: { name: biz-config } }, { secretRef: { name: biz-secrets } }]
        readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 30 }
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: dispute-service, namespace: payment }
spec: { selector: { app: dispute-service }, ports: [{ port: 8080, targetPort: http }] }

