# split-payment 联栈模式 — SP-AC-7 纯 gRPC 内部服务.
#
# 方案选 "无 Dockerfile, 用官方 golang image + bind mount monorepo" 而不是写 Dockerfile:
#   - split-payment 还没有自己的 Dockerfile, 联栈跑成本最低
#   - go.mod 里 replace ../accounting-system 直接复用本机源码
#   - 改完代码 `docker restart split-payment` 几秒就重跑, 不用 build image
#
# 生产部署应该独立 stripe-gateway 服务 / 真镜像; 本 override 仅供联栈 dev.
#
# 网络: payment-stack 共享网, 直接 DNS 找 accounting-system:50051.
# 端口: 9098 暴露到 host (admin-web BFF 在 host 上跑时可达; 容器里直接 DNS).

services:
  split-payment:
    # Go 版本必须 >= monorepo 最高的 go.mod 要求 (accounting-system 用 1.25).
    # tag 'golang:1.25' 对应 1.25.x 系列.
    image: golang:1.25
    container_name: split-payment
    restart: unless-stopped
    networks:
      - payment-stack
    working_dir: /workspace/packages/split-payment
    volumes:
      # 整个 monorepo 挂进来 (split-payment go.mod 用 replace ../accounting-system 等
      # 兄弟仓 path, 必须能看到 packages/ 同级).
      # overrides/ → deploy/ → payment-admin-web/ → packages/ → monorepo root, 共 4 级.
      - ../../../..:/workspace
      - split-go-cache:/root/.cache/go-build
      - split-go-mod:/go/pkg/mod
    environment:
      SPLIT_GRPC_PORT: "9098"
      ACCOUNTING_GRPC_ADDR: "accounting-system:50051"
      # MySQL 持久化 (跟 accounting-system 一样复用 shared-meta meta 库)
      SPLIT_PAYMENT_DSN: "split_user:password@tcp(shared-meta:3306)/split_payment?parseTime=true&charset=utf8mb4"
      # Kafka 事件订阅 (refund.completed) — 复用 risk-stack 的 kafka
      SPLIT_PAYMENT_KAFKA_BROKERS: "risk-kafka:9092"
      CGO_ENABLED: "0"
      # 关掉 workspace 模式: monorepo 根有 go.work, 但 split-payment 自带 replace
      # 指 ../accounting-system, 不需要 workspace; workspace 模式还跟 -mod 标志冲突.
      GOWORK: "off"
      # 万一镜像 Go 版本比 go.mod 要求低, 允许自动下载匹配 toolchain.
      GOTOOLCHAIN: "auto"
    # bash + /dev/tcp 内置 TCP probe, 不需要装 nc.
    # 所有 shell 变量用 $$  转义, 避免 compose 解释 $i / $ok.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        echo "[bootstrap] waiting for shared-meta:3306"
        ok=0
        for i in $$(seq 1 60); do
          if (echo > /dev/tcp/shared-meta/3306) 2>/dev/null; then
            echo "[bootstrap] shared-meta:3306 reachable (took $${i}x2s)"
            ok=1
            break
          fi
          echo "[bootstrap] waiting ... ($$i/60)"
          sleep 2
        done
        if [ "$$ok" = "0" ]; then
          echo "[bootstrap] WARN: shared-meta unreachable after 120s, continuing anyway"
        fi

        echo "[bootstrap] installing mariadb-client (best-effort)"
        apt-get update -qq 2>&1 | tail -2 || true
        apt-get install -y --no-install-recommends mariadb-client 2>&1 | tail -2 || true

        if command -v mariadb >/dev/null 2>&1; then
          mariadb --skip-ssl -h shared-meta -uroot -ppassword <<'SQL' 2>&1 | tail -5 || echo "[bootstrap] WARN: DB create failed"
        CREATE DATABASE IF NOT EXISTS split_payment DEFAULT CHARSET utf8mb4;
        CREATE USER IF NOT EXISTS 'split_user'@'%' IDENTIFIED BY 'password';
        GRANT ALL ON split_payment.* TO 'split_user'@'%';
        FLUSH PRIVILEGES;
        SQL
          echo "[bootstrap] split_payment DB ensured"
        else
          echo "[bootstrap] WARN: mariadb client not installed, skipping DB bootstrap"
        fi

        echo "[bootstrap] go mod tidy (sync go.mod for new grpcsvc imports)"
        cd /workspace/packages/split-payment
        go mod tidy 2>&1 | tail -5 || echo "[bootstrap] WARN: go mod tidy failed, trying anyway"

        echo "[bootstrap] starting split-payment service"
        exec go run ./cmd/server
    ports:
      - "9098:9098"
    depends_on: []

volumes:
  split-go-cache: {}
  split-go-mod: {}

networks:
  payment-stack:
    external: true
