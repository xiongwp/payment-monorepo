# user-merchant-core 联栈模式：同 order-core / payment-channel 思路
#   - 加入 payment-stack network
#   - depends_on 清空，meta + 10 shard 都用 shared-meta / shared-shard-0..9
#   - 用 config.docker.yaml 覆盖掉默认 config.yaml（viper 只认 config.yaml）
#   - host 侧 metrics 避让 payment-core metrics 9190（container 9291 不冲突）
#   - 把 base compose 里指向自带 MySQL（meta:3306 / shard-0..9:3306）的 DSN env
#     重定向到 shared-meta / shared-shard-0..9。viper env 优先级 > yaml 文件，
#     base compose 的 env 会覆盖 config.docker.yaml 的 database.*，所以这里必须
#     显式改写，否则 mgr.ShardCount() == 0，应用 fallback 到单 meta，路由全部
#     落到不存在的 user_merchant_meta.merchants → 启动后 1146 报错刷屏。
services:
  user-merchant-core:
    networks:
      - payment-stack
    environment:
      USERMERCHANTCORE_LOG_DEV: "true"   # 联栈模式默认人读日志
      # etcd 自注册（cmd/server/registry.go）：BFF / api-gateway 通过 etcd
      # resolver 拿到所有 user-merchant-core 副本。空则跳过注册。
      USERMERCHANTCORE_REGISTRY_ENDPOINTS: "etcd:2379"
      # ── 联栈 meta：shared-meta:3306/user_merchant_meta ──
      USERMERCHANTCORE_DATABASE_META_DSN: "root:password@tcp(shared-meta:3306)/user_merchant_meta?charset=utf8mb4&parseTime=True&loc=Local"
      # ── 10 shard：shared-shard-0..9:3306/user_merchant_db_0..9 ──
      USERMERCHANTCORE_DATABASE_SHARD_0_DSN: "root:password@tcp(shared-shard-0:3306)/user_merchant_db_0?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_1_DSN: "root:password@tcp(shared-shard-1:3306)/user_merchant_db_1?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_2_DSN: "root:password@tcp(shared-shard-2:3306)/user_merchant_db_2?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_3_DSN: "root:password@tcp(shared-shard-3:3306)/user_merchant_db_3?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_4_DSN: "root:password@tcp(shared-shard-4:3306)/user_merchant_db_4?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_5_DSN: "root:password@tcp(shared-shard-5:3306)/user_merchant_db_5?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_6_DSN: "root:password@tcp(shared-shard-6:3306)/user_merchant_db_6?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_7_DSN: "root:password@tcp(shared-shard-7:3306)/user_merchant_db_7?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_8_DSN: "root:password@tcp(shared-shard-8:3306)/user_merchant_db_8?charset=utf8mb4&parseTime=True&loc=Local"
      USERMERCHANTCORE_DATABASE_SHARD_9_DSN: "root:password@tcp(shared-shard-9:3306)/user_merchant_db_9?charset=utf8mb4&parseTime=True&loc=Local"
    depends_on: !override []
    volumes: !override
      - ${USER_MERCHANT_DOCKER_CONFIG}:/app/config/config.yaml:ro
    # 端口走 base compose 的 range (19240-19241:9191 / 19340-19341:9291) 支持 scale=2。

networks:
  payment-stack:
    external: true
