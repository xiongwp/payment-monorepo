# reconplatform 在 payment-admin-web/deploy.sh 联栈模式下的部署。
#
# 同 image 部署 2 个容器：
#   - reconplatform-engine：老 expr 引擎（cmd/main.go），消费 Kafka 跑规则
#   - reconplatform-admin： 新 CDC + 动态对账中台（cmd/recon-admin/main.go）
#                          单页编辑器 + 脚本 CRUD + 实时搜索
#
# 关键改动 vs reconplatform/docker-compose.yml（独立栈）：
#   - 不起独立 redis：复用 risk-stack 的 risk-redis（同网内可达）
#   - 不起独立 kafka：复用 risk-stack 的 risk-kafka
#   - admin web 暴露 9180 给宿主机（运营浏览器访问编辑器）
#   - 加入 payment-stack network（业务服务通过 DNS 'reconplatform-admin' 访问）
#
# 多副本：
#   admin 单副本即可（写入操作不并发关键），engine 可 scale 独立消费 group 分区。

services:
  reconplatform-engine:
    build:
      # context 指向 reconplatform 自己的目录（默认 cmd/main.go）
      context: ../../../reconplatform
      dockerfile: Dockerfile
      additional_contexts:
        # 兄弟仓注入：reconplatform Dockerfile 里 COPY --from=payment-util
        # 走 BuildKit additional_context 拿到本地 ../payment-util。
        payment-util: ../../../payment-util
      secrets:
        - GITHUB_TOKEN
    image: reconplatform:local
    pull_policy: never
    container_name: reconplatform-engine
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # Redis / Kafka 复用 risk-stack
      - RECON_REDIS_ADDR=risk-redis:6379
      - RECON_KAFKA_BROKERS=risk-kafka:9092
      - RECON_KAFKA_CONSUME_TOPICS=order,payment
      - RECON_KAFKA_PRODUCE_TOPIC=reconcile_result
      - RECON_KAFKA_CONSUMER_GROUP=reconplatform
      - RECON_METRICS_PORT=8080
      # 从 config-center 拉规则（OnChange 热更）；prod 必须可达
      - RECON_CONFIGCENTER_ENDPOINT=http://config-center:9691
      - RECON_ENV=${RECON_ENV:-dev}
      # engine 不跑 CDC，但保留同名 env 让 image 共享一份 sanity（本地 dev 把
      # admin 和 engine env 对齐，避免后续把 cdc 集成进 engine 时再补一遍）
      - RECON_CDC_USER=${RECON_CDC_USER:-recon_cdc}
      - RECON_CDC_PASS=${RECON_CDC_PASS:-recon_cdc_pwd}
    networks:
      - payment-stack

  reconplatform-admin:
    # 共用同一 image；用不同的 entrypoint / command 跑新二进制。
    # CDC/scheduler/admin web 需要的依赖：Redis（事件存储 + 索引 + 脚本持久化）
    image: reconplatform:local
    pull_policy: never            # 这个 tag 永远是本地 build，没 registry
    container_name: reconplatform-admin
    restart: unless-stopped
    # 覆盖默认 CMD，跑 recon-admin binary（cmd/recon-admin/main.go）
    entrypoint: ["/app/recon-admin"]
    command: []
    depends_on:
      - reconplatform-engine    # 共用 image，触发 build；engine 不存在时跳过依赖
    ports:
      - "9180:8080"             # admin web + API + metrics
    environment:
      - TZ=Asia/Shanghai
      - RECON_REDIS_ADDR=risk-redis:6379
      - RECON_HTTP_PORT=8080
      - RECON_CONFIGCENTER_ENDPOINT=http://config-center:9691
      - RECON_ENV=${RECON_ENV:-dev}
      # CDC 用 MySQL 账号 — 必须在所有 shared-shard-* + shared-meta 里 GRANT
      # REPLICATION SLAVE, REPLICATION CLIENT, SELECT 权限。
      # configs/cdc.sources.yaml 里 user/password 字段读这两个 env。
      - RECON_CDC_USER=${RECON_CDC_USER:-recon_cdc}
      - RECON_CDC_PASS=${RECON_CDC_PASS:-recon_cdc_pwd}
    networks:
      - payment-stack

networks:
  payment-stack:
    external: true

# BuildKit secret：Dockerfile 走 git clone fallback 时用（GITHUB_TOKEN env）。
secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
