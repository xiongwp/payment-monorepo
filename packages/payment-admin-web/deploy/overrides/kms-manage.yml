# kms-manage 加入共享 network。keystore 目录由 deploy.sh 通过 KMS_KEYS_DIR
# 注入绝对路径（payment-admin-web/deploy/kms-keys）；启动前先跑 deploy.sh
# init-kms 生成 master key。
services:
  kms:
    networks:
      payment-stack:
        # 兄弟服务的 config 都写 kms.endpoint=kms-manage:9290（历史命名）。
        # base compose 里 service 名是 `kms`（不是 kms-manage），且 container_name
        # 故意不写以支持 scale=N，所以只有 `kms` 这个 service 名能 DNS 解析。
        # 这里加 alias `kms-manage` 让历史 endpoint 配置照常工作（多副本下
        # Docker DNS 仍然返多个 IP，client gRPC 走 round_robin LB）。
        aliases:
          - kms-manage
    environment:
      KMS_LOG_DEV: "true"   # 联栈模式默认人读日志
      # etcd 自注册：让 BFF 通过 etcd resolver 解析到所有 kms-manage 副本。
      # 无此 env → registry.endpoints 空 → 注册被跳过 → BFF 报
      # "Unavailable: no children to pick from"。
      KMS_REGISTRY_ENDPOINTS: "etcd:2379"
    # keystore 必须 RW：base compose 的 entrypoint 启动时要 chmod 0700 目录
    # + chmod 0600 *.key 自我修正权限（host 拷过来的 key 经常是 0644，
    # 启动检查会拒绝）。:ro 会让 chmod 报 "Read-only file system"，启动失败。
    # 生产推荐 ReadOnlyMany PV + 在 PV 创建时把权限设好后用 :ro。
    volumes:
      - ${KMS_KEYS_DIR}:/var/lib/kms-manage/keys

networks:
  payment-stack:
    external: true
