name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOFLAGS: -mod=mod

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-admin-web/backend
    steps:
      - name: Checkout payment-admin-web
        uses: actions/checkout@v4
        with: { path: payment-admin-web }
      - name: Checkout sibling accounting-grpc-api (try matching branch)
        id: accounting_grpc_api_match
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xiongwp/accounting-grpc-api
          path: accounting-grpc-api
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout sibling accounting-grpc-api (default branch fallback)
        if: steps.accounting_grpc_api_match.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: xiongwp/accounting-grpc-api
          path: accounting-grpc-api
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
      - name: Checkout sibling kms-manage (try matching branch)
        id: kms_manage_match
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xiongwp/kms-manage
          path: kms-manage
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout sibling kms-manage (default branch fallback)
        if: steps.kms_manage_match.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: xiongwp/kms-manage
          path: kms-manage
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
      - name: Checkout sibling order-core (try matching branch)
        id: order_core_match
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xiongwp/order-core
          path: order-core
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout sibling order-core (default branch fallback)
        if: steps.order_core_match.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: xiongwp/order-core
          path: order-core
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: claude/create-order-grpc-service-mDTD8
      - name: Checkout sibling payment-channel (try matching branch)
        id: payment_channel_match
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xiongwp/payment-channel
          path: payment-channel
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout sibling payment-channel (default branch fallback)
        if: steps.payment_channel_match.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: xiongwp/payment-channel
          path: payment-channel
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: claude/general-work-i5bx1
      - name: Checkout sibling payment-core (try matching branch)
        id: payment_core_match
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xiongwp/payment-core
          path: payment-core
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout sibling payment-core (default branch fallback)
        if: steps.payment_core_match.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: xiongwp/payment-core
          path: payment-core
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: claude/general-work-i5bx1
      - name: Checkout sibling payment-util (try matching branch)
        id: payment_util_match
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xiongwp/payment-util
          path: payment-util
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout sibling payment-util (default branch fallback)
        if: steps.payment_util_match.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: xiongwp/payment-util
          path: payment-util
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main
      - name: Checkout sibling risk-manage (try matching branch)
        id: risk_manage_match
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xiongwp/risk-manage
          path: risk-manage
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout sibling risk-manage (default branch fallback)
        if: steps.risk_manage_match.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: xiongwp/risk-manage
          path: risk-manage
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: claude/start-new-session-pVc84
      - name: Checkout sibling user-merchant-core (try matching branch)
        id: user_merchant_core_match
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: xiongwp/user-merchant-core
          path: user-merchant-core
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout sibling user-merchant-core (default branch fallback)
        if: steps.user_merchant_core_match.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: xiongwp/user-merchant-core
          path: user-merchant-core
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          ref: claude/setup-user-merchant-core-w0GCt
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Tidy go.sum (auto-add payment-util + accounting-grpc-api entries)
        run: go mod tidy
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      # Lint 仍 non-blocking（cosmetic）；vuln scan 改为硬失败 — CVE 级问题
      # 不应混进 main。已知 false-positive 可在 govulncheck.yaml 加 ignore 规则。
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: payment-admin-web/backend
          args: --timeout=5m
