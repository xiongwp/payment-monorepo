# ============================================================================
# loadtest 容器 —— 加入 payment-admin-web 的 payment-stack 网络
#
# 前提：payment-admin-web/deploy.sh up 已起好全栈
#   - shared-meta + shared-shard-0..9 (mysql, deploy/shared-db/)
#   - risk-redis  (单实例 redis，accounting 用，deploy/overrides/risk-stack.yml)
#   - kafka, etcd, kms-manage, ...（各 service override）
#   - accounting-service (DNS: accounting-service:50051 / :8888)
#   - split-payment (DNS: split-payment:9098)
#
# 这个 compose 只新增 loadtest + loadtest-bootstrap 两个一次性容器（用 docker
# compose run --rm 跑）。Go binary 源码在 packages/split-payment/cmd/loadtest{,
# -bootstrap}/main.go；Dockerfile 在本目录 Dockerfile.loadtest。
#
# 调用：
#   cd packages/payment-admin-web/loadtest
#   ./scripts/run.sh
# ============================================================================

networks:
  default:
    name: payment-stack
    external: true

services:
  loadtest:
    build:
      # context = packages/split-payment（go.mod replace 兄弟仓需要从这里看到 ../*）
      context: ../../split-payment
      # Dockerfile 在 payment-admin-web/loadtest/ 自己一份（用 absolute-ish 相对路径）
      dockerfile: ../payment-admin-web/loadtest/Dockerfile.loadtest
      additional_contexts:
        payment-util:        ../../payment-util
        accounting-system:   ../../accounting-system
        accounting-grpc-api: ../../accounting-grpc-api
      secrets:
        - GITHUB_TOKEN
    image: payment-loadtest:latest
    # 不写 container_name —— `docker compose run --rm` 每次给临时名字
    environment:
      LOADTEST_TARGET_SPLIT_PAYMENT_ENDPOINT: "split-payment:9098"
      LOADTEST_TARGET_ACCOUNTING_ENDPOINT:    "accounting-service:50051"
      LOADTEST_TARGET_ACCOUNTING_ADMIN_HTTP:  "http://accounting-service:8888"
      LOADTEST_REPORT_OUTPUT_PATH:            "/output/loadtest-report.json"
    volumes:
      - ./config.yaml:/loadtest/config.yaml:ro
      - ./output:/output
      # 4 个资金流 graph JSON —— loadtest 启动期 preload，唯一源在 split-payment seed/
      # split-payment 服务本身也从 seed/scenarios 读 graph（MONEYFLOW_SEED_DIR）
      - ../../split-payment/seed/scenarios:/loadtest/graphs:ro
    # 默认 entrypoint = /usr/local/bin/loadtest
    # bootstrap / 其它入口用 `docker compose run --rm --entrypoint ...` 切
    command: ["--config=/loadtest/config.yaml"]

# BuildKit secrets：从 host 环境变量读 GITHUB_TOKEN
secrets:
  GITHUB_TOKEN:
    environment: GITHUB_TOKEN
