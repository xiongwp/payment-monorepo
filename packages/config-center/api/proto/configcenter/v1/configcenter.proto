syntax = "proto3";

// config-center v1：支付平台统一配置中心。
//
// 核心能力：
//   - namespace + key 二级管理（一个 namespace 通常对应一个服务，如 "card-payment"）
//   - 4 种发布策略 (ReleaseStrategy)：FULL / CANARY / TARGETED / SCHEDULED
//   - 不可变版本号 (Version) — 每次写都产新 version；rollback = 切回旧 version
//   - 生效时间窗口 (effective_at, expire_at) — 客户端读时校验，过期自动忽略
//   - Watch streaming — 客户端长连接订阅 namespace 变化，毫秒级推送
//
// 设计原则：
//   - **写后即读不一致是 OK 的**（最终一致 ~10s）。生产 config 不在交易关键路径，
//     业务可以容忍秒级延迟。换来 server 极简（单 gorm + Kafka）。
//   - **客户端永远有 fallback**：本地内存 cache + 上次成功值；server 全挂 + Kafka 全挂
//     时业务仍按上次值跑。
//   - **审计完整**：每次 admin 写入都记 audit_log（actor + ip + before/after + reason）。
//     reuse user-merchant-core 那套 chained audit。
//   - **强一致只在 admin 操作**：list / read 都走 read replica；推送通知走 Kafka pub/sub。
package configcenter.v1;

option go_package = "github.com/xiongwp/config-center/api/proto/configcenter/v1;configcenterv1";

// ReleaseStrategy 发布策略。
enum ReleaseStrategy {
    UNKNOWN_STRATEGY = 0;

    // FULL：所有订阅了该 namespace 的实例都收到新 version。
    // 即时生效（不看 effective_at；除非 effective_at 在未来）。
    FULL = 1;

    // CANARY：灰度。可按比例（CanarySpec.percent）或显式实例集合
    // (CanarySpec.target_instance_ids)。其他实例继续看上一个 version。
    // 多个并存的 canary 按 priority 排序，命中第一个匹配的。
    CANARY = 2;

    // TARGETED：定点推送。只有 TargetedSpec.instance_ids 里列出的
    // 实例收到这个 version；其他实例不感知。
    // 用例：先在 1 个实例验证再推全量。
    TARGETED = 3;

    // SCHEDULED：定时推送。等到 effective_at 才生效。
    // server 拉取时若 now < effective_at 返 "no change"；到点后正常返。
    // 配合 expire_at 可做"白天用配置 A，22:00 切回 B"。
    SCHEDULED = 4;
}

// Config 单个配置项的值（运行时形态）。
message Config {
    string namespace = 1;        // "card-payment" / "order-core" / ...
    string key = 2;              // "rate_limit.rps" / "feature.new_router" / ...
    string value = 3;            // 序列化后的字符串（JSON / YAML / 纯字符串都可，由 caller 自己解析）
    string format = 4;           // "json" / "yaml" / "plain"；客户端 SDK 据此 unmarshal

    // 版本号：每次 admin 写入 +1，从 1 开始。namespace + key + version 唯一。
    int64 version = 5;

    // 生效时间窗（Unix 秒）；effective_at=0 表示立即；expire_at=0 表示永远不过期。
    int64 effective_at = 6;
    int64 expire_at = 7;

    // 客户端只 trust 满足 (now >= effective_at) && (expire_at==0 || now < expire_at) 的 config。
    // 不满足 → 客户端 fallback 到上一个有效 version。

    string updated_by = 10;      // 最后修改人 (admin user id)
    int64 updated_at = 11;       // Unix 秒
    string change_reason = 12;   // free-form 备注
}

// CanarySpec / TargetedSpec：策略详情（后端按 release 表里的一行 JSON 列存）。
message CanarySpec {
    int32 percent = 1;                       // 0..100，按 instance_id hash mod 100 < percent 命中
    repeated string target_instance_ids = 2; // 显式名单，命中名单内任一即放行（与 percent 并列 OR）
    int32 priority = 3;                      // 多 canary 并存时大优先；同 priority 不保证顺序
}

message TargetedSpec {
    repeated string instance_ids = 1;        // 必须显式命中
}

// ─── 客户端 RPC（mTLS 即可，无 admin 权限要求） ────────────────────────────

message GetConfigRequest {
    string namespace = 1;
    string key = 2;
    string instance_id = 3;   // 客户端身份（hostname / pod_name / IP+port）
                              // server 据此判断 canary / targeted 是否命中
}

message GetConfigResponse {
    Config config = 1;        // nil 表示无生效 config
}

// WatchConfigRequest 订阅 namespace 下所有 key 的变更（不只是单 key）。
//   server 收到后立刻把当前所有 key 的最新生效值推一次（initial sync），
//   之后增量推（每次 admin 写 → server 通知所有 watch streaming → 推到客户端）。
message WatchConfigRequest {
    string namespace = 1;
    string instance_id = 2;
    int64 since_version = 3;  // 0 = full snapshot；>0 = 只推 version 大于此值的
}

message WatchConfigEvent {
    enum EventType {
        UNKNOWN_EVENT = 0;
        SNAPSHOT = 1;        // 订阅时的初始全量
        UPDATE = 2;          // 增量更新（admin 写入触发）
        DELETE = 3;          // key 被 admin 删除
    }
    EventType type = 1;
    Config config = 2;       // type=DELETE 时只有 namespace + key
}

// ─── Admin RPC（mTLS + admin role 校验） ───────────────────────────────────

message PutConfigRequest {
    string namespace = 1;
    string key = 2;
    string value = 3;
    string format = 4;
    int64 effective_at = 5;
    int64 expire_at = 6;
    ReleaseStrategy strategy = 7;
    CanarySpec canary = 8;       // strategy=CANARY 时填
    TargetedSpec targeted = 9;   // strategy=TARGETED 时填
    string change_reason = 10;
    string actor = 11;           // 必填，server 不接信无 actor 的写
}

message PutConfigResponse {
    int64 new_version = 1;
}

message RollbackRequest {
    string namespace = 1;
    string key = 2;
    int64 to_version = 3;        // 目标回滚 version；必须 > 0 且存在
    string actor = 4;
    string change_reason = 5;
}

message RollbackResponse {
    int64 new_version = 1;       // 回滚后产的新 version（不是 to_version；保留单调递增）
}

message ListVersionsRequest {
    string namespace = 1;
    string key = 2;
    int32 limit = 3;             // 默认 20
}

message ListVersionsResponse {
    repeated Config versions = 1; // 按 version desc
}

message DeleteConfigRequest {
    string namespace = 1;
    string key = 2;
    string actor = 3;
    string change_reason = 4;
}

message DeleteConfigResponse {}

// ─── service ────────────────────────────────────────────────────────────────

service ConfigCenter {
    // ─── 客户端 ───
    rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
    rpc WatchConfig(WatchConfigRequest) returns (stream WatchConfigEvent);

    // ─── admin ───
    rpc PutConfig(PutConfigRequest) returns (PutConfigResponse);
    rpc Rollback(RollbackRequest) returns (RollbackResponse);
    rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
    rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse);
}
