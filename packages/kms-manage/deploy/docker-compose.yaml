version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.10
    container_name: kms-etcd
    ports:
      - "2379:2379"
    environment:
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  kms-manage:
    build:
      context: ../../
      dockerfile: packages/kms-manage/Dockerfile
    image: kms-manage:latest
    ports:
      - "9290-9292:9290"
      - "9390-9392:9390"
    depends_on:
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      KMS_ENV: dev
      KMS_LOG_DEV: "true"
      KMS_SERVER_GRPC_PORT: 9290
      KMS_METRICS_ADDR: ":9390"
      KMS_REDIS_ENABLED: "true"
      KMS_REDIS_ADDR: "redis:6379"
      KMS_REDIS_CACHE_TTL: "5m"
      KMS_REDIS_READ_TIMEOUT: "1s"
      KMS_REDIS_WRITE_TIMEOUT: "1s"
      KMS_KEYSTORE_DIR: "/var/lib/kms-manage/keys"
      ETCD_ENDPOINTS: "etcd:2379"
    volumes:
      - kms_keys:/var/lib/kms-manage/keys
      - ./config:/etc/kms-manage
    networks:
      - kms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9390/readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Load balancer for round-robin across 3 replicas
  nginx:
    image: nginx:alpine
    container_name: kms-lb
    ports:
      - "9280:9280"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - kms-manage
    networks:
      - kms-network

volumes:
  redis_data:
  kms_keys:

networks:
  kms-network:
    driver: bridge
