# ─── etcd 服务发现 stack ───────────────────────────────────────────────────────
#
# 全 monorepo 的 Kitex 服务注册/发现都用这一个 etcd 实例 (key prefix = svc 名,
# 跟旧 gRPC payment-util/serviceregistry.Registrar 兼容).
#
# 启动:
#   docker network create payment-stack 2>/dev/null || true
#   cd packages/etcd
#   docker compose up -d
#
# 验证:
#   docker exec etcd etcdctl get --prefix '' --keys-only
#   # 业务服务起来后这里能看到 "accounting-service/<ip>:50051" 这种 key
#
# 注意: 单节点 etcd 适合 dev / 联调. prod 部署至少 3 节点 (Raft quorum), 见
# infra/k8s/etcd-statefulset.yaml.

networks:
  default:
    name: ${SHARED_DB_NETWORK:-payment-stack}
    external: true

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=payment-stack
      - --auto-compaction-mode=periodic
      - --auto-compaction-retention=24h
      - --quota-backend-bytes=2147483648  # 2GB; 服务发现数据量很小, 主要防 wal 撑爆
      - --log-level=info
    ports:
      - "127.0.0.1:2379:2379"   # client API; 仅 localhost 暴露
      - "127.0.0.1:2380:2380"   # peer (单节点也开着, 方便后续扩到 3 节点)
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  etcd-data:
