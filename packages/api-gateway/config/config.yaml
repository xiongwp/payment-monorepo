# api-gateway 配置示例
# 生产部署：用 K8s ConfigMap 挂载到 /etc/api-gateway/config.yaml；
# 敏感字段（auth.tokens / kms.bearer_token）通过 Secret + 环境变量注入。

server:
  # 公网入口 HTTP 端口
  http_port: 8080
  # 单请求 body 上限（字节）。商户回调可能携带大 payload，但 1MB 已足够。
  max_request_bytes: 1048576
  # 读 / 写超时；防 slowloris、保护 fd 池
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s

# 内部管理 HTTP（K8s 集群内可达，不暴露公网）。健康检查 + 路由热重载。
admin:
  port: 8081
  # 留空 = warn-only。生产必填，比较走 subtle.ConstantTimeCompare。
  # 也可通过 ADMIN_HTTP_TOKEN env 注入（优先级更高）。
  token: ""

# Prometheus 指标端口
metrics:
  port: 9090

# OTel exporter；空 = 不导出 trace。
# OTEL_EXPORTER_OTLP_ENDPOINT env 也可。
otel:
  endpoint: ""

# 鉴权
auth:
  # API key 校验开关。开启时所有 /v1/* 必须带 X-API-Key 头。
  enabled: false
  # 静态合法 token 列表（dev 用）。生产 → KMS 解密 + 数据库查 merchant_channel_secret。
  # 支持 KMS 密文格式：直接写 "kms:v1:<key_id>:..."，启动时透明解密。
  tokens: []

# config-center —— 全平台动态配置中心。
# 启动期同步拉一次 snapshot 到本地 cache；admin web 改后秒级 push 到所有副本。
# endpoint 可通过 APIGW_CONFIGCENTER_ENDPOINT env 注入。
configcenter:
  endpoint: "http://config-center:9691"   # 共享 docker network payment-stack 容器 DNS
  namespace: "api-gateway"
  # instance_id 留空 → 用 HOSTNAME / POD_NAME（main.go 兜底）

# 限流 bootstrap 默认值 —— config-center 不可达兜底用。
# 真实运行参数由 config-center 推送（namespace=api-gateway, key=rate_limit, JSON）：
#   {"ip_rps":100,"ip_burst":200,"merchant_rps":1000,"merchant_burst":2000}
# admin web 改一次，集群所有副本秒级 SetLimit 热更新（保留 token bucket 状态）。
rate_limit:
  ip_rps: 100
  ip_burst: 200
  merchant_rps: 1000
  merchant_burst: 2000

# 下游 gRPC 服务地址。空 = 该路由禁用。
upstream:
  order_core: ""        # e.g. order-core:50051
  user_merchant: ""     # e.g. user-merchant-core:9191
  payment_core: ""      # e.g. payment-core:9090
  rpc_timeout: 10s

# kms-manage（用来透明解密 KMS 密文 token / 商户 API key）
kms:
  endpoint: ""          # 空 = passthrough，直接当原样字符串处理
  bearer_token: ""
  rpc_timeout: 3s
