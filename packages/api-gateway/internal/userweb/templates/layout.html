{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<style>
:root { --bg:#0d0d12; --card:#16161e; --text:#e6e6ea; --muted:#888; --accent:#5b8cff; --err:#ff5b5b; --ok:#3ddc84; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,system-ui,sans-serif;
       margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.card { background:var(--card); border-radius:12px; padding:32px; width:100%; max-width:380px;
        box-shadow:0 4px 24px rgba(0,0,0,.4); }
h1 { margin:0 0 6px; font-size:22px; font-weight:600; }
.sub { color:var(--muted); margin:0 0 24px; font-size:13px; }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; margin-top:14px; }
input { width:100%; padding:10px 12px; background:#22222c; border:1px solid #333; border-radius:6px;
        color:var(--text); font:inherit; }
input:focus { outline:none; border-color:var(--accent); }
button { width:100%; padding:12px; margin-top:20px; background:var(--accent); border:none; border-radius:6px;
         color:white; font:inherit; font-weight:600; cursor:pointer; }
button:hover { opacity:.92; }
button:active { transform:scale(.99); }
.alt { text-align:center; margin-top:16px; font-size:13px; color:var(--muted); }
.alt a { color:var(--accent); text-decoration:none; }
.flash { background:#3a1a1a; border-left:3px solid var(--err); padding:10px 12px; margin-bottom:16px;
         border-radius:4px; font-size:13px; color:#ffd0d0; }
.flash.ok { background:#1a3a24; border-left-color:var(--ok); color:#d0ffe0; }
.row { display:flex; gap:8px; }
.row > div { flex:1; }
.kv { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #2a2a35; font-size:13px; }
.kv:last-child { border-bottom:none; }
.kv span:first-child { color:var(--muted); }
</style>
</head>
<body>
<div class="card">
{{template "content" .}}
</div>
<script>
// 极简前端指纹：仅采集 SDK 没在跑时的 fallback 信号。
(function(){
  try {
    var fp = [navigator.userAgent, screen.width+'x'+screen.height, navigator.language,
              new Date().getTimezoneOffset(), navigator.hardwareConcurrency||0].join('|');
    // FNV-1a hash
    var h = 0x811c9dc5;
    for (var i = 0; i < fp.length; i++) { h ^= fp.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
    var hex = ('00000000' + h.toString(16)).slice(-8);
    document.cookie = 'fp='+hex+';path=/;max-age=2592000;samesite=lax';
  } catch (e) {}
})();
</script>
</body></html>{{end}}
