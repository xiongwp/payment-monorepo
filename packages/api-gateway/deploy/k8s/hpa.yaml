# HPA: api-gateway 入口扩容策略。
#
# 容量分析（参考 docs/CAPACITY_10K_TPS.md §2.1）：
#   - TLS handshake / sec ~5K per instance → 10K TPS 需要 2 replicas 起
#   - HTTP fd 上限 65K (sysctl) → 单实例足够，不是瓶颈
#   - BFF 内 mTLS gRPC 连接池 200 / instance（已调）
#
# 扩容触发：
#   - CPU >70% (TLS 握手 + JSON encoding 是主要 CPU 消耗)
#   - QPS（如果 prometheus-adapter 上线）；目标每 instance 5K req/sec
#   - 内存（防 fd 累积 / goroutine 泄漏）
#
# 防抖配置：
#   - scaleDown 5min 稳定窗口，避免大促间歇期反复扩缩
#   - scaleUp 30s + 100% / step（流量突增 1min 内可 4 倍扩容）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3   # 多 AZ 高可用最低
  maxReplicas: 50  # 入口承压 → 扩容上限给得足
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 50, periodSeconds: 60 }
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods,    value: 6,   periodSeconds: 30 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
    # 自定义指标（需 prometheus-adapter）：单实例 RPS 目标
    # 解开下面注释后，扩容更精准（CPU 是滞后指标，QPS 是先行）。
    # - type: Pods
    #   pods:
    #     metric:
    #       name: api_gateway_http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: "5000"
