# SLO Error Budget — risk-manage
#
# 设计原则（Google SRE Book）：
#   1. SLI（Service Level Indicator）：可测的客观指标
#   2. SLO（Objective）：目标值 + 时间窗口
#   3. Error Budget = (1 - SLO) * 时间窗口流量
#   4. Budget 消费 100% → 触发 release freeze（停止 risky deploy）
#
# Prometheus rule + alertmanager 联动：
#   - Recording rules 长期沉淀 SLI 时间序列
#   - Alerting rules 在 budget 燃烧速度 (burn rate) 异常时触发
#   - 双窗口 multi-burn-rate 告警（1h 快 + 6h 慢确认）减少噪音
#
# 详见：https://sre.google/workbook/alerting-on-slos/

groups:
  # ─── Recording rules：SLI 时间序列 ───────────────────────────────
  - name: risk_slo_recording
    interval: 30s
    rules:

      # Screen 成功率 SLI（核心 SLI #1）
      # success = decision returned within budget && no internal 5xx
      - record: risk:screen_success_rate:5m
        expr: |
          (
            sum(rate(risk_screen_total{result="ok"}[5m]))
          )
          /
          (
            sum(rate(risk_screen_total[5m]))
          )

      - record: risk:screen_success_rate:1h
        expr: |
          (
            sum(rate(risk_screen_total{result="ok"}[1h]))
          )
          /
          (
            sum(rate(risk_screen_total[1h]))
          )

      - record: risk:screen_success_rate:30d
        expr: avg_over_time(risk:screen_success_rate:5m[30d])

      # Screen 延迟 SLI（核心 SLI #2）
      # success = p99 < 100ms (与 stage timeout global_ceiling 对齐)
      - record: risk:screen_latency_p99:5m
        expr: histogram_quantile(0.99, sum by (le) (rate(risk_screen_duration_seconds_bucket[5m])))

      - record: risk:screen_latency_p99:1h
        expr: histogram_quantile(0.99, sum by (le) (rate(risk_screen_duration_seconds_bucket[1h])))

      # ML 推理可用 SLI（次要 SLI）
      - record: risk:ml_success_rate:5m
        expr: |
          sum(rate(risk_ml_score_total{result="ok"}[5m]))
          /
          sum(rate(risk_ml_score_total[5m]))

      # Webhook 投递成功率 SLI
      - record: risk:webhook_delivery_rate:1h
        expr: |
          sum(rate(risk_webhook_delivery_total{result="ok"}[1h]))
          /
          sum(rate(risk_webhook_delivery_total[1h]))

  # ─── SLO 配置（可配置常量）────────────────────────────────────
  #
  # SLO 目标：
  #   Screen 可用性  99.95% / 30d → budget = 21.6 min/30d
  #   Screen p99 延迟 < 100ms (95% of measurement intervals)
  #   ML 可用性       99.9% / 30d  → budget = 43.2 min/30d
  #   Webhook 投递   99.0% / 30d  → budget = 7.2 hours/30d
  #
  # 商业版 SLA tier（参考 COMMERCIAL.md）：
  #   Starter:    99.9%
  #   Pro:        99.95%
  #   Enterprise: 99.99%

  # ─── 多窗口多燃烧率告警（multi-window multi-burn-rate）─────────
  #
  # 推荐配置（SRE Book table 5-1）：
  #   Severity   Long window  Short window  Burn rate  Budget consumed
  #   ─────────  ───────────  ────────────  ─────────  ─────────────────
  #   Page       1h           5m            14.4×      2% in 1h
  #   Page       6h           30m            6×        5% in 6h
  #   Ticket     3d           6h            1×         10% in 3d
  #
  # 14.4× burn rate = 假设保持该速度，月预算 36h 烧完（30d=720h）
  - name: risk_slo_burn_rate_alerts
    interval: 30s
    rules:

      # 高燃烧率（page，5min + 1h 双确认）
      - alert: RiskScreenSLOBurnFast
        expr: |
          (1 - risk:screen_success_rate:5m) > (0.0005 * 14.4)
          and
          (1 - risk:screen_success_rate:1h) > (0.0005 * 14.4)
        for: 2m
        labels:
          severity: page
          slo: screen_availability
          tier: pro
        annotations:
          summary: "Screen SLO 高燃烧率（14.4×）— 2% 预算 / 1h"
          description: |
            Screen 成功率 5m={{ printf "%.4f" $value }}，已超过 14.4× burn rate 阈值。
            如不止血，月度预算（21.6min/30d for 99.95%）将在 2 天内烧完。
            建议立即执行：
              1. /admin/rules/rollback 把可疑新规则回滚
              2. /admin/ml/rollout/rollback 模型 rollout 回上一 stage
              3. 检查 Kitex client breaker 状态 /metrics

      # 中燃烧率（page，30min + 6h 双确认）
      - alert: RiskScreenSLOBurnMedium
        expr: |
          (1 - risk:screen_success_rate:5m) > (0.0005 * 6)
          and
          (1 - risk:screen_success_rate:1h) > (0.0005 * 6)
        for: 15m
        labels:
          severity: page
          slo: screen_availability
        annotations:
          summary: "Screen SLO 中燃烧率（6×）— 5% 预算 / 6h"
          description: "持续此速率月度预算将在 5 天内烧完。检查最近 deploy / 流量异常。"

      # 慢燃烧率（ticket，6h + 3d 双确认）
      - alert: RiskScreenSLOBurnSlow
        expr: |
          (1 - risk:screen_success_rate:1h) > (0.0005 * 1)
        for: 1h
        labels:
          severity: ticket
          slo: screen_availability
        annotations:
          summary: "Screen SLO 慢燃烧率（1×）— 10% 预算 / 3d"
          description: "建议工作时间内排查根因，否则月底预算可能见底。"

      # Latency SLO
      - alert: RiskScreenLatencyBurnFast
        expr: risk:screen_latency_p99:5m > 0.1
        for: 5m
        labels:
          severity: page
          slo: screen_latency
        annotations:
          summary: "Screen p99 > 100ms — 触发延迟 SLO 燃烧"
          description: |
            当前 p99={{ printf "%.3fs" $value }} 超过 SLA 100ms 阈值。
            可能原因：(a) ML 推理慢 (b) IPIntel 下游慢 (c) feature lookup miss
            参考 /admin/reliability/limits 看 inflight 是否撑爆。

      # ─── Error budget 耗尽（freeze release）─────────────────
      - alert: RiskScreenBudgetExhausted
        expr: |
          (1 - avg_over_time(risk:screen_success_rate:5m[30d])) >= 0.0005
        for: 1h
        labels:
          severity: page
          slo: screen_availability
          action: freeze_release
        annotations:
          summary: "Screen 月度 error budget 已耗尽 — 触发 release freeze"
          description: |
            30d window 内成功率跌破 99.95%。立即执行：
              1. 暂停所有 risk-manage 的 deploy（除回滚 / 修 bug）
              2. 召集 incident review
              3. 等待下个 SLO window 才恢复 deploy
            参考 https://sre.google/workbook/release-engineering/

      # ─── 其他 SLI 告警 ────────────────────────────────────
      - alert: RiskMLAvailabilitySLO
        expr: risk:ml_success_rate:5m < 0.99
        for: 10m
        labels:
          severity: page
          slo: ml_availability
        annotations:
          summary: "ML 推理成功率 < 99% — fail-open 路径在大量触发"

      - alert: RiskWebhookDeliverySLO
        expr: risk:webhook_delivery_rate:1h < 0.99
        for: 30m
        labels:
          severity: ticket
          slo: webhook_delivery
        annotations:
          summary: "Webhook 商户投递率 < 99% — 检查 DLQ"
