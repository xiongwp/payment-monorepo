server:
  grpc_port: 9490

metrics:
  addr: ":9590"

# ─── Screen per-stage timeout budget ────────────────────────────────
# 每个 stage 用独立 sub-ctx 强制 deadline；超时 fail-open（用空结果继续）
# 并打 metric。global_ceiling 给整个 Screen 一个总上限。
# 当前从 env 读（详见 cmd/server/main.go: readScreenTimeouts）；以下值为
# 文档参考，实际 prod 由 env 覆盖：
#   RISK_SCREEN_TO_FEATURE_EXTRACT_MS  20
#   RISK_SCREEN_TO_IPINTEL_MS          15
#   RISK_SCREEN_TO_MLSCORE_MS          30
#   RISK_SCREEN_TO_ENGINE_EVAL_MS      10
#   RISK_SCREEN_TO_AUDIT_WRITE_MS      0   # 0 = async fire-and-forget
#   RISK_SCREEN_TO_GLOBAL_CEILING_MS   100
#   RISK_SCREEN_TIMEOUTS_DISABLED      0   # 紧急回退；1 = 关闭所有 stage timeout
screen:
  timeouts:
    feature_extract_ms: 20
    ipintel_ms:         15
    ml_score_ms:        30
    engine_eval_ms:     10
    audit_write_ms:     0    # 0 = async
    global_ceiling_ms:  100
    fail_policy:        "open"  # 当前固定 open；字段保留未来扩展

# ─── 风控规则配置 ────────────────────────────────────────────────────
# 每条规则：
#   id:       唯一标识
#   name:     人可读名
#   type:     规则类型（amount_limit / velocity / blacklist / country_block）
#   enabled:  是否生效
#   config:   该类型特有的 JSON 参数
#
# decision 逻辑：所有 enabled 规则按序 evaluate，取最严厉的（DENY > REVIEW > ALLOW）。
rules:
  # ── 限额 ──
  - id: limit_per_txn_50k
    name: "单笔上限 ₱50,000"
    type: amount_limit
    enabled: true
    config: '{"max_per_txn": 5000000, "scope_by": "merchant", "currency": "PHP"}'

  - id: limit_daily_merchant_200k
    name: "商户日累计上限 ₱200,000"
    type: amount_limit
    enabled: true
    config: '{"max_daily": 20000000, "scope_by": "merchant", "currency": "PHP"}'

  - id: limit_daily_customer_100k
    name: "用户日累计上限 ₱100,000"
    type: amount_limit
    enabled: true
    config: '{"max_daily": 10000000, "scope_by": "customer", "currency": "PHP"}'

  - id: limit_monthly_customer_500k
    name: "用户月累计上限 ₱500,000"
    type: amount_limit
    enabled: true
    config: '{"max_monthly": 50000000, "scope_by": "customer", "currency": "PHP"}'

  # ── 速率 ──
  - id: velocity_customer_10_5m
    name: "用户 5 分钟内不超过 10 笔"
    type: velocity
    enabled: true
    config: '{"max_count": 10, "window_min": 5, "scope_by": "customer"}'

  - id: velocity_ip_20_10m
    name: "同 IP 10 分钟内不超过 20 笔"
    type: velocity
    enabled: true
    config: '{"max_count": 20, "window_min": 10, "scope_by": "ip"}'

  - id: velocity_device_5_3m
    name: "同设备 3 分钟内不超过 5 笔"
    type: velocity
    enabled: true
    config: '{"max_count": 5, "window_min": 3, "scope_by": "device"}'

  # ── 黑名单 ──
  - id: bl_merchant
    name: "商户黑名单"
    type: blacklist
    enabled: true
    config: '{"dimension": "merchant"}'

  - id: bl_customer
    name: "用户黑名单"
    type: blacklist
    enabled: true
    config: '{"dimension": "customer"}'

  - id: bl_ip
    name: "IP 黑名单"
    type: blacklist
    enabled: true
    config: '{"dimension": "ip"}'

  - id: bl_device
    name: "设备黑名单"
    type: blacklist
    enabled: true
    config: '{"dimension": "device"}'

  # ── 国家 / 币种 ──
  - id: country_whitelist_ph
    name: "仅允许 PH 交易"
    type: country_block
    enabled: true
    config: '{"mode": "allow", "countries": ["PH"], "currencies": ["PHP"]}'
