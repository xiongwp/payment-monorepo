# Prometheus config — docker-compose 用。生产应该走 prometheus-operator
# + ServiceMonitor (deploy/k8s/servicemonitor.yaml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: risk-manage
    static_configs:
      - targets: ['risk-manage:9590']
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ['kafka:9101']    # JMX exporter (CP image 自带)

  - job_name: clickhouse
    static_configs:
      - targets: ['clickhouse:9363']  # CH 自带 prometheus endpoint

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

# alerting 配 alertmanager 地址；docker-compose 没启 alertmanager，alerts.yaml
# 仅作为规则检验。生产应该补 alertmanager 容器或推到外部 alertmanager。
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']
