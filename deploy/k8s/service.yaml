apiVersion: v1
kind: Service
metadata:
  name: order-core
  labels: { app: order-core }
spec:
  type: ClusterIP
  selector: { app: order-core }
  ports:
    - { name: grpc,    port: 9091, targetPort: grpc }
    - { name: metrics, port: 9095, targetPort: metrics }
---
# headless 副本：grpc-go 客户端的 dns:/// resolver 走它，可拿到所有 endpoints
# 做客户端 LB（avoid Service 单点 5-tuple-hash 偏分布）。
apiVersion: v1
kind: Service
metadata:
  name: order-core-headless
  labels: { app: order-core }
spec:
  clusterIP: None
  selector: { app: order-core }
  ports:
    - { name: grpc, port: 9091, targetPort: grpc }
