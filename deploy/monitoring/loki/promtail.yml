# Promtail — 从 docker 日志 driver 抓 stdout/stderr 推给 Loki。
#
# 抓所有 docker 容器, 把 compose service / project / container_name 转成 label,
# 后续 Grafana 可按 service / merchant_id / trace_id 过滤。

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
- url: http://loki:3100/loki/api/v1/push
  backoff_config:
    min_period: 100ms
    max_period: 5s
    max_retries: 10
  batchwait: 1s
  batchsize: 1048576

scrape_configs:
# 1) 所有 docker 容器 (compose 起来的)
- job_name: docker
  docker_sd_configs:
  - host: unix:///var/run/docker.sock
    refresh_interval: 10s

  relabel_configs:
  # service label 从 compose service 名拿 (com.docker.compose.service)
  - source_labels: [__meta_docker_container_label_com_docker_compose_service]
    target_label: service
  # project 名
  - source_labels: [__meta_docker_container_label_com_docker_compose_project]
    target_label: project
  # container_name 留着 (调试用)
  - source_labels: [__meta_docker_container_name]
    target_label: container
    regex: /(.*)
    replacement: $1

  pipeline_stages:
  # 1.1 解 JSON 日志 (zap 默认 JSON 输出)
  - json:
      expressions:
        level: level
        ts: ts
        msg: msg
        trace_id: trace_id
        merchant_id: merchant_id
        actor: actor
        method: method

  # 1.2 把字段提到 label (注意控制 cardinality, merchant_id 不提为 label 避免爆)
  - labels:
      level:

  # 1.3 timestamp 用日志里的 ts (RFC3339), 解析失败用接收时间
  - timestamp:
      source: ts
      format: RFC3339Nano
      fallback_formats:
      - RFC3339
      - Unix

  # 1.4 高基数字段保留在 content 里 (可 LogQL 后做 |= "merchant_id=mer_xxx")
  # 不再额外提 label
