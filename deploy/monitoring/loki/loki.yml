# Loki 配置 — 单实例 dev/staging 用。生产换 Loki cluster + S3 backend.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
  - from: 2024-01-01
    store: boltdb-shipper
    object_store: filesystem
    schema: v12
    index:
      prefix: index_
      period: 24h

# Limit aggressive cardinality (防止商户 id 爆 label)
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h     # 7d
  max_query_length: 720h               # 30d (跨月查询用)
  max_query_series: 5000
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h               # 30d (符合 GDPR 等; 审计日志另在 DB 7y)

# Loki 自己也暴露 metrics, 接进 Prometheus
analytics:
  reporting_enabled: false
