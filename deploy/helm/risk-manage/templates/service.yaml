apiVersion: v1
kind: Service
metadata:
  name: {{ include "risk-manage.fullname" . }}
  labels: {{- include "risk-manage.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: grpc,    port: {{ .Values.service.grpc.port }},    targetPort: grpc }
    - { name: metrics, port: {{ .Values.service.metrics.port }}, targetPort: metrics }
  selector: {{- include "risk-manage.selectorLabels" . | nindent 4 }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "risk-manage.fullname" . }}-audit
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "risk-manage.fullname" . }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "risk-manage.selectorLabels" . | nindent 6 }}
{{- end }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "risk-manage.fullname" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "risk-manage.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPU }} }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetMemory }} }
{{- end }}
---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "risk-manage.fullname" . }}
  labels: {{- include "risk-manage.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "risk-manage.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.scrapeInterval }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "risk-manage.fullname" . }}-secrets
type: Opaque
stringData:
  clickhouse-username: "risk_writer"
  clickhouse-password: {{ .Values.clickhouse.password | default "change_me" | quote }}
  admin-token-read:    {{ .Values.adminTokens.read | quote }}
  admin-token-write:   {{ .Values.adminTokens.write | quote }}
  admin-token-danger:  {{ .Values.adminTokens.danger | quote }}
