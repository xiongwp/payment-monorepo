# 全平台默认 values. 生产环境 helm install --values prod.yaml 覆盖.

# 全局
global:
  env: prod               # dev / staging / prod
  namespace: payment
  image:
    registry: ghcr.io/example
    pullPolicy: IfNotPresent
    tag: "latest"         # CI 应当 set --set global.image.tag=$(git rev-parse --short HEAD)
  imagePullSecrets: []

  # 各 service 共用的 sidecar / volume / env
  commonEnv:
    LOG_LEVEL: info
    LOG_DEV: "false"
    AUDITLOG_URL: "http://audit-log:8087"
    OTEL_ENDPOINT: "tempo:4317"
    OTEL_SAMPLE_RATIO: "0.05"          # 5% head-based; 详细配置见 OTEL_SAMPLING_*
    OTEL_SAMPLING_RULES_JSON: ""       # 见 docs/SLO.md 的 sampling rules,空 → 走 head-based

  # 安全 / 网络
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  networkPolicy:
    enabled: true

  serviceMonitor:
    enabled: true
    interval: 15s

  pdb:
    enabled: true

  # 共用默认 resources / affinity, per-service 可覆盖
  defaultResources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

  defaultPodAntiAffinity: zone   # 同服务的 Pod 强制分布到不同 zone

  # Vertical Pod Autoscaler (默认 Initial 模式,只给建议,不动态改 limit;
  # 资金链路服务关掉自动调整防止 OOMKill)
  vpa:
    enabled: false
    updateMode: "Initial"

# Secrets (helm 不内置敏感; 真生产用 external-secrets 或 sealed-secrets)
# 这里只列名, --set 时填值
secrets:
  oauth2AdminToken: "REPLACE"
  amlAdminToken: "REPLACE"
  vaultAdminToken: "REPLACE"
  vaultDekHex: "REPLACE_64HEX"
  taxAdminToken: "REPLACE"
  drAdminToken: "REPLACE"
  approvalAuditToken: "REPLACE"

# ── ha-data sub-chart toggle ──
ha-data:
  enabled: true   # 启用 Redis Sentinel / MySQL primary+replica / Kafka RF=3 / ClickHouse
  # 详细配置见 chart/charts/ha-data/values.yaml

# ── per-service overrides ──
#
# 每个服务 = { enabled, replicas, resources, env, ... }
# disable a service: <name>.enabled: false

services:
  oauth2-server:
    enabled: true
    replicas: 2
    port: 8087
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 1000m, memory: 512Mi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPU: 70 }
    podAntiAffinity: zone
    pdb: { minAvailable: 1 }
    env: {}

  aml-screening:
    enabled: true
    replicas: 2
    port: 8088
    resources:
      requests: { cpu: 200m, memory: 512Mi }   # 名单 70w 内存
      limits:   { cpu: 2000m, memory: 2Gi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPU: 70 }
    podAntiAffinity: zone
