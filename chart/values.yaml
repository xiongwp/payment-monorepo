# 全平台默认 values. 生产环境 helm install --values prod.yaml 覆盖.

# 全局
global:
  env: prod               # dev / staging / prod
  namespace: payment
  image:
    registry: ghcr.io/example
    pullPolicy: IfNotPresent
    tag: "latest"         # CI 应当 set --set global.image.tag=$(git rev-parse --short HEAD)
  imagePullSecrets: []

  # 各 service 共用的 sidecar / volume / env
  commonEnv:
    LOG_LEVEL: info
    LOG_DEV: "false"
    AUDITLOG_URL: "http://audit-log:8087"
    OTEL_ENDPOINT: "tempo:4317"
    OTEL_SAMPLE_RATIO: "0.01"

  # 安全 / 网络
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  networkPolicy:
    enabled: true

  serviceMonitor:
    enabled: true
    interval: 15s

  pdb:
    enabled: true

# Secrets (helm 不内置敏感; 真生产用 external-secrets 或 sealed-secrets)
# 这里只列名, --set 时填值
secrets:
  oauth2AdminToken: "REPLACE"
  amlAdminToken: "REPLACE"
  vaultAdminToken: "REPLACE"
  vaultDekHex: "REPLACE_64HEX"
  taxAdminToken: "REPLACE"
  drAdminToken: "REPLACE"
  approvalAuditToken: "REPLACE"

# ── per-service overrides ──
#
# 每个服务 = { enabled, replicas, resources, env, ... }
# disable a service: <name>.enabled: false

services:
  oauth2-server:
    enabled: true
    replicas: 2
    port: 8087
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 1000m, memory: 512Mi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPU: 70 }
    env: {}

  aml-screening:
    enabled: true
    replicas: 2
    port: 8088
    resources:
      requests: { cpu: 200m, memory: 512Mi }   # 名单 70w 内存
      limits: { cpu: 2000m, memory: 2Gi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPU: 70 }
    env:
      AML_REFRESH_OFAC: "1"

  tokenization-vault:
    enabled: true
    replicas: 3   # PCI 高 HA
    port: 8089
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 12, targetCPU: 60 }
    podAntiAffinity: zone
    pdb: { minAvailable: 2 }
    env: {}

  tax-reporting:
    enabled: true
    replicas: 2
    port: 8090
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPU: 70 }
    cron:
      enabled: true
      schedule: "0 3 31 1 *"   # 每年 1/31 03:00 跑 1099-K 批量生成
    env: {}

  data-rights:
    enabled: true
    replicas: 2
    port: 8091
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    hpa: { enabled: false }
    env: {}

  approval-service:
    enabled: true
    replicas: 2  # SSE sticky session
    port: 8092
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    serviceAffinity: clientIP
    env: {}

  audit-log:
    enabled: true
    replicas: 1   # hash chain 单写者
    port: 8087
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    env: {}

  merchant-webhook:
    enabled: true
    replicas: 3
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPU: 70 }
    env: {}

  payment-core:
    enabled: true
    replicas: 3
    port: 9090
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 2000m, memory: 2Gi }
    hpa: { enabled: true, minReplicas: 3, maxReplicas: 30, targetCPU: 70 }
    env: {}

  payment-channel:
    enabled: true
    replicas: 2
    port: 9092
    resources:
