# e2e 测试: 起 aml-screening + audit-log 验证 batch HTTPSink 链路.
# 跟 deploy.sh 风格隔离 (单独 project, 独立端口).

networks:
  e2e-audit-net:
    driver: bridge

services:
  audit-log:
    build:
      context: ../../packages/audit-log
    image: audit-log:e2e
    container_name: e2e-audit-log
    networks: [e2e-audit-net]
    ports:
      - "18097:8080"
    environment:
      AUDITLOG_HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 5

  aml-screening:
    build:
      context: ../../packages/aml-screening
    image: aml-screening:e2e
    container_name: e2e-aml-screening
    networks: [e2e-audit-net]
    ports:
      - "18098:8088"
    environment:
      AML_ADDR: ":8088"
      AML_ADMIN_TOKEN: "e2e-admintok"
      AML_DEV_SEED: "1"
      AML_REFRESH_OFAC: "0"
      # 关键: HTTPSink 指向 audit-log 容器名 (docker DNS 解析)
      AUDITLOG_URL: "http://e2e-audit-log:8080"
      AUDITLOG_TOKEN: ""
    depends_on:
      audit-log:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/healthz"]
      interval: 3s
      timeout: 2s
      retries: 5
